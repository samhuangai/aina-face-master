name: Build AINA Rain Real-Mesh Visual Identity Candidate

on:
  pull_request:
    branches: [ci/aina-identity-master-base]
    paths:
      - RUN_AINA_RAIN_IDENTITY_VISUAL_LOCK
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-rain-real-mesh-visual-identity
  cancel-in-progress: true

jobs:
  rain_visual_identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install artifact and image dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Materialize the approved AINA references
        run: |
          set -euo pipefail
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
          test -s references/AINA_APPROVED_FRONT.jpg
          test -s references/AINA_APPROVED_3Q.jpg
          test -s references/AINA_APPROVED_SIDE.jpg

      - name: Download the verified Rain Identity Master v2 candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, os, requests, shutil, zipfile
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          response = requests.get(
              f'https://api.github.com/repos/{repository}/actions/artifacts',
              headers=headers,
              params={'name': 'AINA-RAIN-IDENTITY-MASTER-V2', 'per_page': 100},
              timeout=30,
          )
          response.raise_for_status()
          artifacts = [item for item in response.json().get('artifacts', []) if not item.get('expired')]
          if not artifacts:
              raise SystemExit('No AINA-RAIN-IDENTITY-MASTER-V2 artifact is available')
          artifact = max(artifacts, key=lambda item: item['id'])
          archive = requests.get(
              artifact['archive_download_url'], headers=headers, timeout=240, allow_redirects=True
          )
          archive.raise_for_status()
          root = Path('source_v2_artifact')
          if root.exists():
              shutil.rmtree(root)
          root.mkdir()
          with zipfile.ZipFile(io.BytesIO(archive.content)) as zf:
              zf.extractall(root)

          def locate(name):
              matches = list(root.rglob(name))
              if not matches:
                  raise FileNotFoundError(name)
              return matches[0]

          stable = Path('source_v2')
          stable.mkdir(exist_ok=True)
          shutil.copy2(locate('AINA_RAIN_IDENTITY_MASTER_V2.blend'), stable / 'candidate.blend')
          shutil.copy2(locate('AINA_RAIN_IDENTITY_MASTER_V2_REPORT.json'), stable / 'candidate_report.json')
          (stable / 'artifact_id.txt').write_text(str(artifact['id']))
          print({'artifact_id': artifact['id'], 'artifact_size': artifact['size_in_bytes']})
          PY
          test -s source_v2/candidate.blend
          test -s source_v2/candidate_report.json

      - name: Install Blender 4.5.12 LTS and software rendering runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libglx-mesa0 libosmesa6 libx11-6 libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libice6
          sudo ldconfig
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz \
            -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"

      - name: Reconstruct the same real Mesh and recover bilateral eye anatomy
        run: |
          set +e
          mkdir -p output_rain_visual_identity/Preview output_rain_visual_identity/QA
          xvfb-run -a -s '-screen 0 1600x900x24' "$BLENDER" \
            source_v2/candidate.blend \
            --background --python-exit-code 1 \
            --python src/blender/aina_rain_identity_visual_lock.py -- \
            --out output_rain_visual_identity \
            2>&1 | tee output_rain_visual_identity/QA/AINA_RAIN_VISUAL_IDENTITY_BUILD.log
          code=${PIPESTATUS[0]}
          echo "$code" > output_rain_visual_identity/QA/AINA_RAIN_VISUAL_IDENTITY_EXIT.txt
          exit "$code"

      - name: Build approved-reference and expression review sheets
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          out = Path('output_rain_visual_identity')
          preview = out / 'Preview'
          qa = out / 'QA'
          pairs = [
              (Path('references/AINA_APPROVED_FRONT.jpg'), preview / 'AINA_RAIN_IDENTITY_MASTER_FRONT.png', 'FRONT'),
              (Path('references/AINA_APPROVED_3Q.jpg'), preview / 'AINA_RAIN_IDENTITY_MASTER_THREE_QUARTER.png', '3Q'),
              (Path('references/AINA_APPROVED_SIDE.jpg'), preview / 'AINA_RAIN_IDENTITY_MASTER_SIDE.png', 'SIDE'),
          ]
          panels = []
          for reference_path, model_path, label in pairs:
              reference = Image.open(reference_path).convert('RGB')
              model = Image.open(model_path).convert('RGB')
              reference.thumbnail((430, 430))
              model.thumbnail((430, 430))
              panel = Image.new('RGB', (900, 480), 'white')
              panel.paste(reference, ((440-reference.width)//2, 6))
              panel.paste(model, (455+(440-model.width)//2, 6))
              draw = ImageDraw.Draw(panel)
              draw.text((10, 450), f'APPROVED AINA {label}', fill='black')
              draw.text((465, 450), f'REAL RAIN-MESH VISUAL CANDIDATE {label}', fill='black')
              panels.append(panel)
          sheet = Image.new('RGB', (900, 480 * len(panels)), 'white')
          for index, panel in enumerate(panels):
              sheet.paste(panel, (0, index * 480))
          sheet.save(qa / 'AINA_APPROVED_VS_RAIN_VISUAL_IDENTITY.png')

          expression_files = [
              ('NEUTRAL', preview / 'AINA_RAIN_IDENTITY_MASTER_FRONT.png'),
              ('HAPPY', preview / 'AINA_RAIN_IDENTITY_MASTER_HAPPY.png'),
              ('SAD', preview / 'AINA_RAIN_IDENTITY_MASTER_SAD.png'),
              ('BLINK', preview / 'AINA_RAIN_IDENTITY_VISUAL_LOCK_BLINK.png'),
              ('CLAY FRONT', preview / 'AINA_RAIN_IDENTITY_MASTER_CLAY_FRONT.png'),
              ('CLAY 3Q', preview / 'AINA_RAIN_IDENTITY_MASTER_CLAY_THREE_QUARTER.png'),
          ]
          expression_panels = []
          for label, path in expression_files:
              image = Image.open(path).convert('RGB')
              image.thumbnail((400, 400))
              panel = Image.new('RGB', (420, 440), 'white')
              panel.paste(image, ((420-image.width)//2, 5))
              ImageDraw.Draw(panel).text((10, 415), label, fill='black')
              expression_panels.append(panel)
          expression_sheet = Image.new('RGB', (1260, 880), 'white')
          for index, panel in enumerate(expression_panels):
              expression_sheet.paste(panel, ((index % 3) * 420, (index // 3) * 440))
          expression_sheet.save(qa / 'AINA_RAIN_VISUAL_IDENTITY_EXPRESSION_SHEET.png')
          PY
          test -s output_rain_visual_identity/QA/AINA_APPROVED_VS_RAIN_VISUAL_IDENTITY.png
          test -s output_rain_visual_identity/QA/AINA_RAIN_VISUAL_IDENTITY_EXPRESSION_SHEET.png

      - name: Enforce real-model, topology, symmetry and expression gates
        run: |
          set -euo pipefail
          test -s output_rain_visual_identity/AINA_RAIN_IDENTITY_VISUAL_LOCK_CANDIDATE.blend
          test -s output_rain_visual_identity/AINA_RAIN_IDENTITY_VISUAL_LOCK_CANDIDATE.glb
          test -s output_rain_visual_identity/QA/AINA_RAIN_IDENTITY_VISUAL_LOCK_REPORT.json
          python - <<'PY'
          import json
          from pathlib import Path

          previous = json.loads(Path('source_v2/candidate_report.json').read_text())
          report = json.loads(Path('output_rain_visual_identity/QA/AINA_RAIN_IDENTITY_VISUAL_LOCK_REPORT.json').read_text())
          assert report['real_3d_model'] is True
          assert report['replacement_effect_art_generated'] is False
          assert report['same_skin_topology'] is True
          assert report['topology_changed'] is False
          assert report['armature_preserved'] is True
          assert report['skin_weights_preserved'] is True
          assert report['vertices'] == previous['vertices'] == 6868
          assert report['triangles'] == previous['triangles'] == 12634
          assert len(report['bilateral_anatomy_recovery']['mirrored_components']) >= 4
          assert len(report['bilateral_anatomy_recovery']['iris_objects']) >= 2
          assert report['expression_preservation']['shape_key_count'] == 23
          assert report['expression_preservation']['shape_delta_preservation_max_m'] < 1.0e-5
          assert report['sculpt']['max_displacement_m'] <= 0.0181
          assert report['identity_lock'] is False
          assert report['visual_identity_lock'] is False
          assert report['candidate'] is True
          assert report['vrm_exported'] is False
          print(json.dumps({
              'vertices': report['vertices'],
              'triangles': report['triangles'],
              'mirrored_components': report['bilateral_anatomy_recovery']['mirrored_components'],
              'iris_objects': report['bilateral_anatomy_recovery']['iris_objects'],
              'sculpt': report['sculpt'],
              'expression_preservation': report['expression_preservation'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-RAIN-REAL-MESH-VISUAL-IDENTITY
          path: |
            output_rain_visual_identity/**
            source_v2/artifact_id.txt
          if-no-files-found: error
          retention-days: 30
