name: Build AINA v14 Art Directed Identity
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [src/sculpt_aina_v140_art_directed.py, src/render_aina_v140_qa.py, src/blender/**, .github/workflows/build_v140_art_directed.yml]
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env: {LIBGL_ALWAYS_SOFTWARE: '1', PYOPENGL_PLATFORM: osmesa}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libosmesa6
          pip install numpy==1.26.4 scipy opencv-python-headless onnxruntime trimesh pillow mediapipe==0.10.21 vtk requests tqdm
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: References and FaceVerse
        run: |
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
          git clone --depth 1 https://github.com/Mrkomiljon/faceverse-onnx.git vendor/faceverse-onnx
          cd vendor/faceverse-onnx && python download_models.py --models faceverse_v4_2.npy faceverse_resnet50_float32.onnx && cd ../..
      - name: Build v12.5 and v14
        run: |
          python src/fit_aina_faceverse_v124_axisfix.py --front references/AINA_APPROVED_FRONT.jpg --three-quarter references/AINA_APPROVED_3Q.jpg --front-landmarks references/AINA_TARGET_3DDFA_SPARSE_68.json --out output_faceverse_v124
          python src/sculpt_aina_faceverse_v125_residual.py --base-full output_faceverse_v124/AINA_FACEVERSE_FULL_v12.4_AXISFIX.obj --front references/AINA_APPROVED_FRONT.jpg --faceverse-data vendor/faceverse-onnx/data/faceverse_v4_2.npy --out output_faceverse_v125
          python src/sculpt_aina_v140_art_directed.py --base-full output_faceverse_v125/AINA_FACEVERSE_FULL_v12.5_DENSE_RESIDUAL.obj --out output_v140
          python src/render_aina_v140_qa.py --clay output_v140/AINA_FACEVERSE_IDENTITY_CLAY_v14.0.obj --front references/AINA_APPROVED_FRONT.jpg --q3 references/AINA_APPROVED_3Q.jpg --side references/AINA_APPROVED_SIDE.jpg --out output_v140/QA
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: aina-face-master-v14.0-art-directed, path: 'output_v140/**', if-no-files-found: warn, retention-days: 30}
  character-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Blender and MPFB
        run: |
          curl -L --fail -o blender.tar.xz 'https://cdn.builder.blender.org/download/daily/blender-4.5.12-stable+v45.84afd5f785f7-linux.x86_64-release.tar.xz'
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git vendor/mpfb2
      - name: Build body rig base
        run: ./blender/blender -b --python-expr "exec(open('src/blender/aina_body_base.py').read()); exec(open('src/blender/aina_body_rig_export.py').read())"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: aina-character-base-v1, path: 'output_character_base/**', if-no-files-found: warn, retention-days: 30}
