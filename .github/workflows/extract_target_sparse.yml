name: Extract AINA Target Sparse 68

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/dump_3ddfa_sparse.py
      - .github/workflows/extract_target_sparse.yml
      - references/AINA_APPROVED_FRONT_V2.jpg.b64

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy==1.26.4 scipy opencv-python-headless pyyaml cython scikit-image tqdm matplotlib
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Materialize reference
        run: base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
      - name: Clone and patch 3DDFA V2
        run: |
          git clone --depth 1 https://github.com/cleardusk/3DDFA_V2.git vendor/3DDFA_V2
          git -C vendor/3DDFA_V2 lfs install --local || true
          git -C vendor/3DDFA_V2 lfs pull || true
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('vendor/3DDFA_V2')
          for glob in ('*.py','*.pyx','*.pxd'):
            for p in root.rglob(glob):
              try: s=p.read_text()
              except: continue
              old=s
              for a,b in [(r'\bnp\.long\b','np.int64'),(r'\bnp\.int\b','np.int64'),(r'\bnp\.float\b','float'),(r'\bnp\.bool\b','bool')]: s=re.sub(a,b,s)
              if s!=old: p.write_text(s)
          PY
          cd vendor/3DDFA_V2 && sh ./build.sh
      - name: Extract 68 landmarks
        run: python src/dump_3ddfa_sparse.py
      - uses: actions/upload-artifact@v4
        with:
          name: aina-target-sparse-68
          path: output_sparse/**
          retention-days: 30
