name: Build AINA v15.5 Final Identity Lock

on:
  push:
    branches: [build/aina-v10-first-fit]
    paths:
      - src/sculpt_aina_v155_identity.py
      - src/render_aina_v155_qa.py
      - .github/workflows/build_v155_identity.yml
  workflow_dispatch:

concurrency:
  group: aina-v15-lock-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install headless geometry runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libosmesa6
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy opencv-python-headless onnxruntime trimesh pillow mediapipe==0.10.21 vtk requests tqdm
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Materialize approved AINA references
        run: |
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg

      - name: Fetch FaceVerse models
        run: |
          git clone --depth 1 https://github.com/Mrkomiljon/faceverse-onnx.git vendor/faceverse-onnx
          cd vendor/faceverse-onnx
          python download_models.py --models faceverse_v4_2.npy faceverse_resnet50_float32.onnx

      - name: Rebuild verified smooth v12.5 source
        run: |
          python src/fit_aina_faceverse_v124_axisfix.py \
            --front references/AINA_APPROVED_FRONT.jpg \
            --three-quarter references/AINA_APPROVED_3Q.jpg \
            --front-landmarks references/AINA_TARGET_3DDFA_SPARSE_68.json \
            --out output_faceverse_v124
          python src/sculpt_aina_faceverse_v125_residual.py \
            --base-full output_faceverse_v124/AINA_FACEVERSE_FULL_v12.4_AXISFIX.obj \
            --front references/AINA_APPROVED_FRONT.jpg \
            --faceverse-data vendor/faceverse-onnx/data/faceverse_v4_2.npy \
            --out output_faceverse_v125

      - name: Sculpt and lock v15.5 identity mesh
        run: |
          python src/sculpt_aina_v155_identity.py \
            --base output_faceverse_v125/AINA_FACEVERSE_FULL_v12.5_DENSE_RESIDUAL.obj \
            --target-landmarks references/AINA_TARGET_3DDFA_SPARSE_68.json \
            --out output_v155

      - name: Render calibrated v15.5 identity QA
        run: |
          python src/render_aina_v155_qa.py \
            --clay output_v155/AINA_FACEVERSE_IDENTITY_CLAY_v15.5.obj \
            --front references/AINA_APPROVED_FRONT.jpg \
            --q3 references/AINA_APPROVED_3Q.jpg \
            --side references/AINA_APPROVED_SIDE.jpg \
            --out output_v155/QA

      - name: Enforce identity lock gate
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('output_v155/AINA_FACEVERSE_v15.5_REPORT.json')
          d=json.loads(p.read_text())
          print(json.dumps(d, indent=2))
          if d.get('identity_lock') is not True:
              raise SystemExit('identity_lock is not true; VRM assembly is blocked')
          if not all(d.get('checks',{}).values()):
              raise SystemExit('one or more identity geometry checks failed')
          print('AINA_V15_5_IDENTITY_LOCK=TRUE')
          PY

      - name: Identity lock summary
        if: always()
        run: |
          echo '## AINA v15.5 Final Identity Lock' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output_v155/AINA_FACEVERSE_v15.5_REPORT.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output_v155/AINA_FACEVERSE_v15.5_REPORT.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload locked v15.5 mesh and calibrated QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aina-face-master-v15.5-final-identity-lock
          path: output_v155/**
          if-no-files-found: warn
          retention-days: 30
