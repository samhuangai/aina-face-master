name: AINA Isolated Real 3D Visual Lock

on:
  pull_request:
    branches: [ci/aina-visual-base]
    paths:
      - RUN_AINA_VISUAL_LOCK

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-isolated-real-3d-visual-lock
  cancel-in-progress: true

jobs:
  visual_lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@v4

      - name: Pull production AINA Blender code only
        run: |
          set -euo pipefail
          git fetch --depth=1 origin \
            build/aina-v10-first-fit:refs/remotes/origin/build/aina-v10-first-fit \
            production/aina-visual-lock:refs/remotes/origin/production/aina-visual-lock
          git checkout origin/build/aina-v10-first-fit -- src/blender
          git checkout origin/production/aina-visual-lock -- \
            src/blender/aina_visual_identity_assembly.py \
            src/blender/aina_visual_identity_runtime.py \
            src/blender/aina_visual_eye_system.py \
            src/blender/aina_visual_hair_system.py
          test -s src/blender/aina_final_vrm_assembly.py
          test -s src/blender/aina_final_vrm_release.py
          test -s src/blender/aina_vrm_addon_runtime.py
          test -s src/blender/aina_visual_identity_runtime.py

      - name: Download already locked v15.5 real mesh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9275974352/zip" -o diag.zip
          unzip -q diag.zip -d diag
          test -s diag/output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj
          test -s diag/output_locked/AINA_FACEVERSE_v15.5_REPORT.json

      - name: Install Blender 4.5.12 LTS plus software X display
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libosmesa6 \
            libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libice6
          sudo ldconfig
          ldconfig -p | grep -E 'libEGL.so.1|libGLX.so.0'
          curl -fL --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"
          git clone --depth 1 --branch v4.5.0 https://github.com/saturday06/VRM-Addon-for-Blender.git vendor/VRM-Addon-for-Blender
          xvfb-run -a ./blender/blender --version

      - name: Sculpt, assemble and render actual AINA real 3D model
        run: |
          set -euo pipefail
          mkdir -p output_visual/QA output_visual/Preview
          xvfb-run -a -s '-screen 0 1920x1080x24' "$BLENDER" --background --factory-startup --python-exit-code 1 \
            --python src/blender/aina_visual_identity_runtime.py -- \
            --face diag/output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj \
            --identity-report diag/output_locked/AINA_FACEVERSE_v15.5_REPORT.json \
            --out output_visual

      - name: Hard gate six actual model renders
        run: |
          set -euo pipefail
          test -s output_visual/AINA_MASTER.blend
          test -s output_visual/QA/AINA_VISUAL_IDENTITY_QA.json
          for f in \
            AINA_REAL_NEUTRAL_FRONT.png \
            AINA_REAL_NEUTRAL_3Q.png \
            AINA_REAL_HAPPY_FRONT.png \
            AINA_REAL_SURPRISED_FRONT.png \
            AINA_REAL_BLINK_FRONT.png \
            AINA_REAL_AA_FRONT.png; do
              test -s "output_visual/Preview/$f"
          done
          python3 - <<'PY'
          import json, pathlib
          q=pathlib.Path('output_visual/QA/AINA_VISUAL_IDENTITY_QA.json')
          d=json.loads(q.read_text())
          d['ci_visual_gate']=True
          d['actual_preview_files']=sorted(p.name for p in pathlib.Path('output_visual/Preview').glob('AINA_REAL_*.png'))
          d['master_bytes']=pathlib.Path('output_visual/AINA_MASTER.blend').stat().st_size
          d['vrm_candidate_bytes']=pathlib.Path('output_visual/AINA.vrm').stat().st_size if pathlib.Path('output_visual/AINA.vrm').exists() else 0
          q.write_text(json.dumps(d,indent=2),encoding='utf-8')
          print(json.dumps(d,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-REAL-3D-VISUAL-LOCK-ISOLATED
          path: |
            output_visual/AINA_MASTER.blend
            output_visual/AINA.vrm
            output_visual/Preview/**
            output_visual/QA/**
          if-no-files-found: warn
          retention-days: 30
