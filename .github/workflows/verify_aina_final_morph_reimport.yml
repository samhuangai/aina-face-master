name: Verify AINA Final Morph Reimport

on:
  push:
    branches: [verify/aina-final-vrm]
    paths:
      - src/repair_aina_final_vrm_morphs.py
      - src/blender/aina_final_vrm_reimport_qa.py
      - src/blender/aina_final_vrm_reimport_runtime.py
      - .github/workflows/verify_aina_final_morph_reimport.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download final VRM base and proven 52-morph probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9275974352/zip" -o diag.zip
          unzip -q diag.zip -d diag
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9276097975/zip" -o probe.zip
          unzip -q probe.zip -d probe
          test -s diag/output_final/AINA.vrm
          test -s probe/raw_head.glb

      - name: Restore exact 52 morph targets and 18 preset bindings
        run: |
          set -euo pipefail
          python3 -m pip install --user numpy
          rm -rf verified_final
          mkdir -p verified_final
          python3 src/repair_aina_final_vrm_morphs.py \
            --base-vrm diag/output_final/AINA.vrm \
            --morph-glb probe/raw_head.glb \
            --out verified_final
          test -s verified_final/AINA.vrm
          cat verified_final/QA/AINA_VRM_BINARY_MORPH_QA.json

      - name: Install Blender 4.5.12 LTS and VRM Addon v4.5.0
        run: |
          set -euo pipefail
          curl -fL --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"
          git clone --depth 1 --branch v4.5.0 https://github.com/saturday06/VRM-Addon-for-Blender.git vendor/VRM-Addon-for-Blender

      - name: Clean Blender reimport hard gate
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 1 \
            --python src/blender/aina_final_vrm_reimport_runtime.py -- \
            --vrm verified_final/AINA.vrm --out verified_final
          python3 - <<'PY'
          import json
          q=json.load(open('verified_final/QA/AINA_VRM_REIMPORT_QA.json'))
          assert q['pass'] is True, q
          assert q['shape_controls_found']==52 and not q['missing_shape_controls'], q
          assert q['presets_verified']==18 and not q['preset_binding_mismatches'], q
          assert q['total_preset_morph_binds']==43, q
          print('AINA_FINAL_REIMPORT_52_OF_52=TRUE')
          print('AINA_FINAL_PRESET_BINDINGS_18_OF_18=TRUE')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-FINAL-MORPH-REIMPORT-VERIFIED
          path: |
            verified_final/AINA.vrm
            verified_final/AINA_REIMPORT_CHECK.blend
            verified_final/QA/**
          if-no-files-found: warn
          retention-days: 14

      - name: Publish exact reimport verification marker
        if: always()
        env:
          VERIFY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          marker={
              'source_commit': os.environ.get('VERIFY_COMMIT',''),
              'pass': False,
              'shape_controls_found': 0,
              'shape_controls_expected': 52,
              'presets_verified': 0,
              'presets_expected': 18,
              'total_preset_morph_binds': 0,
              'expected_total_preset_morph_binds': 43,
              'binary_pass': False,
          }
          b=Path('verified_final/QA/AINA_VRM_BINARY_MORPH_QA.json')
          r=Path('verified_final/QA/AINA_VRM_REIMPORT_QA.json')
          if b.exists():
              bd=json.loads(b.read_text())
              marker['binary_pass']=bool(bd.get('binary_pass'))
              marker['binary_shape_controls']=bd.get('shape_controls',0)
              marker['binary_preset_count']=bd.get('preset_count',0)
              marker['binary_total_preset_morph_binds']=bd.get('total_preset_morph_binds',0)
              marker['vrm_bytes']=bd.get('vrm_bytes',0)
              marker['primitive_target_counts']=bd.get('primitive_target_counts',[])
          if r.exists():
              rd=json.loads(r.read_text())
              marker['reimport_pass']=bool(rd.get('pass'))
              marker['shape_controls_found']=rd.get('shape_controls_found',0)
              marker['presets_verified']=rd.get('presets_verified',0)
              marker['total_preset_morph_binds']=rd.get('total_preset_morph_binds',0)
              marker['preset_binding_mismatches']=rd.get('preset_binding_mismatches',{})
              marker['missing_shape_controls']=rd.get('missing_shape_controls',[])
          marker['pass']=(
              marker.get('binary_pass') is True and
              marker.get('reimport_pass') is True and
              marker.get('shape_controls_found')==52 and
              marker.get('presets_verified')==18 and
              marker.get('total_preset_morph_binds')==43
          )
          Path('qa').mkdir(exist_ok=True)
          Path('qa/AINA_FINAL_REIMPORT_VERIFIED.json').write_text(
              json.dumps(marker,indent=2),encoding='utf-8'
          )
          print(json.dumps(marker,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/AINA_FINAL_REIMPORT_VERIFIED.json
          if ! git diff --cached --quiet; then
            git commit -m "Record AINA final VRM reimport verification"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
