name: Review AINA Final Visual Identity

on:
  push:
    branches: [release/aina-final-production]
    paths:
      - src/sculpt_aina_v155_visual_final.py
      - src/blender/aina_visual_identity_review.py
      - .github/workflows/review_aina_visual_identity.yml
  workflow_dispatch:

concurrency:
  group: aina-visual-identity-review
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download current production MASTER only as a rig/art shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9276172373/zip" -o prior.zip
          unzip -q prior.zip -d prior
          test -s prior/AINA_MASTER.blend
          test -s prior/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj

      - name: Sculpt the same v15.5 topology for visual identity
        run: |
          set -euo pipefail
          pip install numpy==1.26.4 scipy trimesh
          python src/sculpt_aina_v155_visual_final.py \
            --base prior/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj \
            --out visual_face
          python - <<'PY'
          import json
          d=json.load(open('visual_face/AINA_FACEVERSE_v15.5_VISUAL_FINAL_REPORT.json'))
          assert d['topology_changed'] is False
          assert d['two_eye_components'] is True
          assert d['identity_lock'] is False and d['visual_review_required'] is True
          assert d['triangle_area_ratio_p01'] > 0.25
          assert d['triangle_area_ratio_p99'] < 3.5
          print(json.dumps(d,indent=2))
          PY

      - name: Install Blender 4.5.12 LTS
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libice6
          curl -fL --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz -o blender.tar.xz
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"

      - name: Patch real AINA MASTER and render front 3Q profile
        run: |
          set -euo pipefail
          mkdir -p visual_review
          "$BLENDER" --background prior/AINA_MASTER.blend --python-exit-code 1 \
            --python src/blender/aina_visual_identity_review.py -- \
            --face visual_face/AINA_FACEVERSE_FULL_v15.5_VISUAL_FINAL.obj \
            --out visual_review
          test -s visual_review/AINA_VISUAL_REVIEW.blend
          test -s visual_review/Preview/AINA_VISUAL_FRONT.png
          test -s visual_review/Preview/AINA_VISUAL_3Q.png
          test -s visual_review/Preview/AINA_VISUAL_PROFILE.png

      - name: Package real-model identity review
        run: |
          set -euo pipefail
          mkdir -p package/Face package/Preview
          cp visual_face/AINA_FACEVERSE_FULL_v15.5_VISUAL_FINAL.obj package/Face/
          cp visual_face/AINA_FACEVERSE_FULL_v15.5_VISUAL_FINAL.glb package/Face/
          cp visual_face/AINA_FACEVERSE_IDENTITY_CLAY_v15.5_VISUAL_FINAL.glb package/Face/
          cp visual_face/AINA_FACEVERSE_v15.5_VISUAL_FINAL_REPORT.json package/Face/
          cp visual_review/AINA_VISUAL_REVIEW.blend package/
          cp visual_review/Preview/*.png package/Preview/

      - uses: actions/upload-artifact@v4
        with:
          name: AINA-VISUAL-IDENTITY-REVIEW
          path: package/**
          if-no-files-found: error
          retention-days: 14
