name: Dump AINA All Target Landmarks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/dump_all_target_landmarks.py
      - .github/workflows/dump_all_target_landmarks.yml

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Materialize references
        run: |
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
      - name: Dump landmarks
        run: python src/dump_all_target_landmarks.py
      - uses: actions/upload-artifact@v4
        with:
          name: aina-all-target-68
          path: output_target68/**
          retention-days: 30
