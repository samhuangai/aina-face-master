name: Build AINA Rain Identity Convergence v6

on:
  pull_request:
    branches: [ci/aina-rain-convergence-v6-base]
    paths:
      - RUN_AINA_RAIN_IDENTITY_CONVERGENCE_V6
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-rain-identity-convergence-v6
  cancel-in-progress: true

jobs:
  convergence_v6:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install artifact, landmark and image dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pillow
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 face-alignment

      - name: Materialize approved AINA references
        run: |
          set -euo pipefail
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
          test -s references/AINA_APPROVED_FRONT.jpg
          test -s references/AINA_APPROVED_3Q.jpg
          test -s references/AINA_APPROVED_SIDE.jpg
          test -s references/AINA_TARGET_3DDFA_SPARSE_68.json

      - name: Download successful balanced v5 source
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import os
          import shutil
          import zipfile
          from pathlib import Path
          import requests

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          name = 'AINA-RAIN-IDENTITY-BALANCED-V5'
          url = f'https://api.github.com/repos/{repository}/actions/artifacts?name={name}&per_page=100'
          response = requests.get(url, headers=headers, timeout=45)
          response.raise_for_status()
          artifacts = [item for item in response.json().get('artifacts', []) if not item.get('expired')]
          if not artifacts:
              raise SystemExit(f'No unexpired {name} artifact is available')
          artifact = max(artifacts, key=lambda item: item['id'])
          archive = requests.get(
              artifact['archive_download_url'],
              headers=headers,
              timeout=300,
              allow_redirects=True,
          )
          archive.raise_for_status()
          root = Path('source_v5_artifact')
          if root.exists():
              shutil.rmtree(root)
          root.mkdir()
          with zipfile.ZipFile(io.BytesIO(archive.content)) as zf:
              zf.extractall(root)

          def find(name):
              matches = list(root.rglob(name))
              if not matches:
                  raise FileNotFoundError(name)
              return matches[0]

          stable = Path('source_v5')
          stable.mkdir(exist_ok=True)
          files = {
              'AINA_RAIN_IDENTITY_BALANCED_V5.blend': 'candidate.blend',
              'AINA_RAIN_IDENTITY_BALANCED_V5_REPORT.json': 'source_report.json',
              'AINA_RAIN_APPEARANCE_FRONT.png': 'source_front.png',
              'AINA_RAIN_APPEARANCE_THREE_QUARTER.png': 'source_three_quarter.png',
              'AINA_RAIN_APPEARANCE_SIDE.png': 'source_side.png',
          }
          for source_name, destination_name in files.items():
              shutil.copy2(find(source_name), stable / destination_name)
          (stable / 'artifact_id.txt').write_text(str(artifact['id']), encoding='utf-8')
          print({'artifact_id': artifact['id'], 'size': artifact['size_in_bytes']})
          PY
          test -s source_v5/candidate.blend
          test -s source_v5/source_report.json
          test -s source_v5/source_front.png
          test -s source_v5/source_three_quarter.png
          test -s source_v5/source_side.png

      - name: Extract approved versus actual balanced-v5 landmarks
        run: |
          set -euo pipefail
          mkdir -p output_rain_convergence_v6/QA/pre output_rain_convergence_v6/QA/post output_rain_convergence_v6/Preview
          python src/extract_aina_rain_identity_landmarks.py \
            --approved-front references/AINA_APPROVED_FRONT.jpg \
            --approved-q3 references/AINA_APPROVED_3Q.jpg \
            --approved-side references/AINA_APPROVED_SIDE.jpg \
            --model-front source_v5/source_front.png \
            --model-q3 source_v5/source_three_quarter.png \
            --model-side source_v5/source_side.png \
            --front-target references/AINA_TARGET_3DDFA_SPARSE_68.json \
            --out output_rain_convergence_v6/QA/pre
          test -s output_rain_convergence_v6/QA/pre/AINA_RAIN_IDENTITY_LANDMARKS.json

      - name: Install Blender 4.5.12 LTS and software rendering runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libglx-mesa0 libosmesa6 libx11-6 libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libice6
          sudo ldconfig
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz \
            -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"

      - name: Apply render-in-the-loop residual to the real Mesh
        run: |
          set +e
          xvfb-run -a -s '-screen 0 1600x900x24' "$BLENDER" \
            source_v5/candidate.blend \
            --background --python-exit-code 1 \
            --python src/blender/aina_rain_identity_convergence_v6.py -- \
            --landmarks output_rain_convergence_v6/QA/pre/AINA_RAIN_IDENTITY_LANDMARKS.json \
            --source-report source_v5/source_report.json \
            --out output_rain_convergence_v6 \
            2>&1 | tee output_rain_convergence_v6/QA/AINA_RAIN_IDENTITY_CONVERGENCE_V6_BUILD.log
          code=${PIPESTATUS[0]}
          echo "$code" > output_rain_convergence_v6/QA/AINA_RAIN_IDENTITY_CONVERGENCE_V6_EXIT.txt
          exit "$code"

      - name: Extract approved versus actual v6 landmarks
        run: |
          set -euo pipefail
          python src/extract_aina_rain_identity_landmarks.py \
            --approved-front references/AINA_APPROVED_FRONT.jpg \
            --approved-q3 references/AINA_APPROVED_3Q.jpg \
            --approved-side references/AINA_APPROVED_SIDE.jpg \
            --model-front output_rain_convergence_v6/Preview/AINA_RAIN_APPEARANCE_FRONT.png \
            --model-q3 output_rain_convergence_v6/Preview/AINA_RAIN_APPEARANCE_THREE_QUARTER.png \
            --model-side output_rain_convergence_v6/Preview/AINA_RAIN_APPEARANCE_SIDE.png \
            --front-target references/AINA_TARGET_3DDFA_SPARSE_68.json \
            --out output_rain_convergence_v6/QA/post
          test -s output_rain_convergence_v6/QA/post/AINA_RAIN_IDENTITY_LANDMARKS.json

      - name: Compute pre/post normalized multi-view identity metrics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          root = Path('output_rain_convergence_v6/QA')
          pre = json.loads((root / 'pre/AINA_RAIN_IDENTITY_LANDMARKS.json').read_text())
          post = json.loads((root / 'post/AINA_RAIN_IDENTITY_LANDMARKS.json').read_text())

          def points(item):
              for key in ('landmarks_xy', 'points', 'landmarks'):
                  if key in item:
                      result = np.asarray(item[key], dtype=np.float64)[:, :2]
                      break
              else:
                  raise KeyError(f'No landmark array in {list(item)}')
              size = np.asarray(item.get('image_size', item.get('size', [1, 1])), dtype=np.float64)
              return result / np.maximum(size[None, :2], 1.0)

          def procrustes_rmse(a, b):
              a = np.asarray(a, dtype=np.float64)
              b = np.asarray(b, dtype=np.float64)
              a = a - a.mean(axis=0)
              b = b - b.mean(axis=0)
              a /= max(float(np.linalg.norm(a)), 1.0e-9)
              b /= max(float(np.linalg.norm(b)), 1.0e-9)
              u, _, vt = np.linalg.svd(a.T @ b)
              rotation = u @ vt
              if np.linalg.det(rotation) < 0:
                  u[:, -1] *= -1
                  rotation = u @ vt
              aligned = a @ rotation
              return float(np.sqrt(np.mean(np.sum((aligned - b) ** 2, axis=1))))

          def distance(array, a, b):
              return max(float(np.linalg.norm(array[a] - array[b])), 1.0e-9)

          def ratios(array):
              face = distance(array, 0, 16)
              eye_height = 0.25 * (
                  distance(array, 37, 41) + distance(array, 38, 40)
                  + distance(array, 43, 47) + distance(array, 44, 46)
              )
              eye_centres = np.array([
                  array[36:42].mean(axis=0),
                  array[42:48].mean(axis=0),
              ])
              return {
                  'jaw_over_face': distance(array, 4, 12) / face,
                  'chin_over_face': distance(array, 6, 10) / face,
                  'eye_width_over_face': 0.5 * (
                      distance(array, 36, 39) + distance(array, 42, 45)
                  ) / face,
                  'eye_height_over_face': eye_height / face,
                  'eye_spacing_over_face': distance(eye_centres, 0, 1) / face,
                  'nose_over_face': distance(array, 31, 35) / face,
                  'mouth_over_face': distance(array, 48, 54) / face,
                  'lower_height_over_face': abs(float(array[8, 1] - array[33, 1])) / face,
              }

          def ratio_error(approved, model):
              a = ratios(approved)
              m = ratios(model)
              errors = {key: abs(m[key] / max(a[key], 1.0e-9) - 1.0) for key in a}
              return a, m, errors, float(np.mean(list(errors.values())))

          metrics = {'views': {}, 'front_ratios': {}}
          for view in ('front', 'three_quarter', 'side'):
              approved = points(pre['approved'][view])
              before = points(pre['model'][view])
              after = points(post['model'][view])
              metrics['views'][view] = {
                  'pre_procrustes_rmse': procrustes_rmse(before, approved),
                  'post_procrustes_rmse': procrustes_rmse(after, approved),
              }
              metrics['views'][view]['improvement'] = (
                  metrics['views'][view]['pre_procrustes_rmse']
                  - metrics['views'][view]['post_procrustes_rmse']
              )

          approved_front = points(pre['approved']['front'])
          pre_front = points(pre['model']['front'])
          post_front = points(post['model']['front'])
          approved_ratios, pre_ratios, pre_errors, pre_mae = ratio_error(approved_front, pre_front)
          _, post_ratios, post_errors, post_mae = ratio_error(approved_front, post_front)
          metrics['front_ratios'] = {
              'approved': approved_ratios,
              'pre': pre_ratios,
              'post': post_ratios,
              'pre_relative_errors': pre_errors,
              'post_relative_errors': post_errors,
              'pre_mean_absolute_relative_error': pre_mae,
              'post_mean_absolute_relative_error': post_mae,
              'improvement': pre_mae - post_mae,
          }
          pre_mean = float(np.mean([item['pre_procrustes_rmse'] for item in metrics['views'].values()]))
          post_mean = float(np.mean([item['post_procrustes_rmse'] for item in metrics['views'].values()]))
          improved_views = sum(item['post_procrustes_rmse'] < item['pre_procrustes_rmse'] for item in metrics['views'].values())
          metrics['summary'] = {
              'pre_mean_procrustes_rmse': pre_mean,
              'post_mean_procrustes_rmse': post_mean,
              'mean_improvement': pre_mean - post_mean,
              'improved_views': improved_views,
              'all_views_non_worse_5pct': all(
                  item['post_procrustes_rmse'] <= item['pre_procrustes_rmse'] * 1.05 + 1.0e-5
                  for item in metrics['views'].values()
              ),
              'front_ratio_non_worse_5pct': post_mae <= pre_mae * 1.05 + 1.0e-5,
          }
          (root / 'AINA_RAIN_CONVERGENCE_V6_METRICS.json').write_text(
              json.dumps(metrics, indent=2), encoding='utf-8'
          )
          print(json.dumps(metrics, indent=2))
          PY
          test -s output_rain_convergence_v6/QA/AINA_RAIN_CONVERGENCE_V6_METRICS.json

      - name: Build actual-model comparison, expression and clay sheets
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('output_rain_convergence_v6')
          preview = root / 'Preview'
          qa = root / 'QA'
          pairs = [
              ('references/AINA_APPROVED_FRONT.jpg', preview / 'AINA_RAIN_APPEARANCE_FRONT.png', 'FRONT'),
              ('references/AINA_APPROVED_3Q.jpg', preview / 'AINA_RAIN_APPEARANCE_THREE_QUARTER.png', '3Q'),
              ('references/AINA_APPROVED_SIDE.jpg', preview / 'AINA_RAIN_APPEARANCE_SIDE.png', 'SIDE'),
          ]
          panels = []
          for ref_path, model_path, label in pairs:
              ref = Image.open(ref_path).convert('RGB')
              model = Image.open(model_path).convert('RGB')
              ref.thumbnail((430, 430)); model.thumbnail((430, 430))
              panel = Image.new('RGB', (900, 485), 'white')
              panel.paste(ref, ((440-ref.width)//2, 5))
              panel.paste(model, (455+(440-model.width)//2, 5))
              draw = ImageDraw.Draw(panel)
              draw.text((10, 455), f'APPROVED AINA {label}', fill='black')
              draw.text((465, 455), f'REAL RAIN CONVERGENCE V6 {label}', fill='black')
              panels.append(panel)
          approved_sheet = Image.new('RGB', (900, 485*len(panels)), 'white')
          for index, panel in enumerate(panels):
              approved_sheet.paste(panel, (0, index*485))
          approved_sheet.save(qa / 'AINA_APPROVED_VS_RAIN_CONVERGENCE_V6.png')

          names = [
              ('source_v5/source_front.png', 'BALANCED V5'),
              (preview / 'AINA_RAIN_APPEARANCE_FRONT.png', 'CONVERGENCE V6'),
              (preview / 'AINA_RAIN_APPEARANCE_CLAY_FRONT.png', 'V6 CLAY'),
          ]
          change = Image.new('RGB', (1440, 535), 'white')
          for index, (path, label) in enumerate(names):
              image = Image.open(path).convert('RGB')
              image.thumbnail((460, 460))
              change.paste(image, (index*480+(480-image.width)//2, 5))
              ImageDraw.Draw(change).text((index*480+10, 505), label, fill='black')
          change.save(qa / 'AINA_RAIN_V5_VS_V6_FRONT.png')

          expression_names = ['FRONT', 'HAPPY', 'SAD', 'BLINK']
          expression_sheet = Image.new('RGB', (840, 880), 'white')
          for index, name in enumerate(expression_names):
              image = Image.open(preview / f'AINA_RAIN_APPEARANCE_{name}.png').convert('RGB')
              image.thumbnail((400, 400))
              panel = Image.new('RGB', (420, 440), 'white')
              panel.paste(image, ((420-image.width)//2, 5))
              ImageDraw.Draw(panel).text((10, 415), name, fill='black')
              expression_sheet.paste(panel, ((index%2)*420, (index//2)*440))
          expression_sheet.save(qa / 'AINA_RAIN_CONVERGENCE_V6_EXPRESSIONS.png')

          clay_names = ['CLAY_FRONT', 'CLAY_THREE_QUARTER', 'CLAY_SIDE']
          clay_sheet = Image.new('RGB', (1290, 450), 'white')
          for index, name in enumerate(clay_names):
              image = Image.open(preview / f'AINA_RAIN_APPEARANCE_{name}.png').convert('RGB')
              image.thumbnail((410, 410))
              panel = Image.new('RGB', (430, 450), 'white')
              panel.paste(image, ((430-image.width)//2, 5))
              ImageDraw.Draw(panel).text((10, 425), name, fill='black')
              clay_sheet.paste(panel, (index*430, 0))
          clay_sheet.save(qa / 'AINA_RAIN_CONVERGENCE_V6_CLAY.png')
          PY
          test -s output_rain_convergence_v6/QA/AINA_APPROVED_VS_RAIN_CONVERGENCE_V6.png
          test -s output_rain_convergence_v6/QA/AINA_RAIN_V5_VS_V6_FRONT.png
          test -s output_rain_convergence_v6/QA/AINA_RAIN_CONVERGENCE_V6_EXPRESSIONS.png
          test -s output_rain_convergence_v6/QA/AINA_RAIN_CONVERGENCE_V6_CLAY.png

      - name: Enforce topology, morph-preservation and residual-improvement gates
        run: |
          set -euo pipefail
          test -s output_rain_convergence_v6/AINA_RAIN_IDENTITY_CONVERGENCE_V6.blend
          test -s output_rain_convergence_v6/AINA_RAIN_IDENTITY_CONVERGENCE_V6.glb
          test -s output_rain_convergence_v6/QA/AINA_RAIN_IDENTITY_CONVERGENCE_V6_REPORT.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output_rain_convergence_v6/QA/AINA_RAIN_IDENTITY_CONVERGENCE_V6_REPORT.json').read_text())
          metrics = json.loads(Path('output_rain_convergence_v6/QA/AINA_RAIN_CONVERGENCE_V6_METRICS.json').read_text())
          assert report['real_3d_model'] is True
          assert report['replacement_effect_art_generated'] is False
          assert report['skin_topology_changed'] is False
          assert report['armature_preserved'] is True
          assert report['skin_weights_preserved'] is True
          assert report['uvs_preserved'] is True
          assert report['vertices'] == report['source_vertices'] == 6868
          assert report['triangles'] == report['source_triangles'] == 12634
          assert report['head_region_vertices'] > 1000
          assert report['source_shape_key_count'] >= 23
          preservation = report['shape_key_preservation']
          assert preservation['shape_key_count'] >= 23
          assert preservation['shape_delta_preservation_max_m'] < 1.0e-5
          assert preservation['shape_delta_preservation_rms_m'] < 1.0e-6
          assert report['art_directed_residual_disabled'] is True
          assert report['converged_residual_max_m'] <= 0.00381
          assert report['total_skin_displacement_max_m'] <= 0.00381
          summary = metrics['summary']
          assert summary['all_views_non_worse_5pct'] is True
          assert summary['front_ratio_non_worse_5pct'] is True
          assert summary['improved_views'] >= 1
          assert summary['post_mean_procrustes_rmse'] <= summary['pre_mean_procrustes_rmse'] * 1.01 + 1.0e-5
          assert report['identity_lock'] is False
          assert report['visual_identity_lock'] is False
          assert report['production_release'] is False
          assert report['candidate'] is True
          assert report['vrm_exported'] is False
          print(json.dumps({
              'vertices': report['vertices'],
              'triangles': report['triangles'],
              'shape_keys': preservation['shape_key_count'],
              'shape_delta_max_m': preservation['shape_delta_preservation_max_m'],
              'converged_max_m': report['converged_residual_max_m'],
              'pre_mean_rmse': summary['pre_mean_procrustes_rmse'],
              'post_mean_rmse': summary['post_mean_procrustes_rmse'],
              'improved_views': summary['improved_views'],
              'front_ratio_pre': metrics['front_ratios']['pre_mean_absolute_relative_error'],
              'front_ratio_post': metrics['front_ratios']['post_mean_absolute_relative_error'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-RAIN-IDENTITY-CONVERGENCE-V6
          path: |
            output_rain_convergence_v6/**
            source_v5/artifact_id.txt
          if-no-files-found: error
          retention-days: 30
