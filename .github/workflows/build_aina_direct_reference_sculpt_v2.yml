name: Build AINA Direct Reference Sculpt v2

on:
  pull_request:
    branches: [ci/aina-direct-sculpt-v2-base]
    paths:
      - RUN_AINA_DIRECT_REFERENCE_SCULPT_V2
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-direct-reference-sculpt-v2
  cancel-in-progress: true

jobs:
  direct_sculpt_v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install direct-sculpt dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy trimesh matplotlib pillow requests onnxruntime
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Materialize approved AINA references
        run: |
          set -euo pipefail
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
          test -s references/AINA_APPROVED_FRONT.jpg
          test -s references/AINA_APPROVED_3Q.jpg
          test -s references/AINA_APPROVED_SIDE.jpg
          test -s references/AINA_TARGET_3DDFA_SPARSE_68.json

      - name: Download the latest successful custom-head v1 transfer source
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import os
          import shutil
          import zipfile
          from pathlib import Path
          import requests

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          name = 'AINA-CUSTOM-IDENTITY-HEAD-V1'
          response = requests.get(
              f'https://api.github.com/repos/{repository}/actions/artifacts?name={name}&per_page=100',
              headers=headers,
              timeout=45,
          )
          response.raise_for_status()
          artifacts = [item for item in response.json().get('artifacts', []) if not item.get('expired')]
          if not artifacts:
              raise SystemExit(f'No unexpired {name} artifact is available')
          artifact = max(artifacts, key=lambda item: item['id'])
          archive = requests.get(
              artifact['archive_download_url'],
              headers=headers,
              timeout=300,
              allow_redirects=True,
          )
          archive.raise_for_status()
          root = Path('source_v1_artifact')
          if root.exists():
              shutil.rmtree(root)
          root.mkdir()
          with zipfile.ZipFile(io.BytesIO(archive.content)) as zf:
              zf.extractall(root)

          matches = list(root.rglob('AINA_CUSTOM_HEAD_TRANSFER_v1.npz'))
          if not matches:
              raise FileNotFoundError('AINA_CUSTOM_HEAD_TRANSFER_v1.npz')
          stable = Path('source_v1')
          stable.mkdir(exist_ok=True)
          shutil.copy2(matches[0], stable / 'AINA_CUSTOM_HEAD_TRANSFER_v1.npz')
          (stable / 'artifact_id.txt').write_text(str(artifact['id']), encoding='utf-8')
          print({'artifact_id': artifact['id'], 'size': artifact['size_in_bytes']})
          PY
          test -s source_v1/AINA_CUSTOM_HEAD_TRANSFER_v1.npz

      - name: Fetch FaceVerse landmark topology
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Mrkomiljon/faceverse-onnx.git vendor/faceverse-onnx
          cd vendor/faceverse-onnx
          python download_models.py --models faceverse_v4_2.npy
          test -s data/faceverse_v4_2.npy
          cd ../..

      - name: Sculpt the real topology directly against approved AINA references
        run: |
          set -euo pipefail
          python src/sculpt_aina_direct_reference_v2.py \
            2>&1 | tee output_direct_sculpt_v2_build.log
          test -s output_direct_sculpt_v2/AINA_DIRECT_REFERENCE_HEAD_FULL_v2.obj
          test -s output_direct_sculpt_v2/AINA_DIRECT_REFERENCE_HEAD_FULL_v2.glb
          test -s output_direct_sculpt_v2/AINA_DIRECT_REFERENCE_TRANSFER_v2.npz
          test -s output_direct_sculpt_v2/AINA_DIRECT_REFERENCE_SCULPT_v2_REPORT.json
          test -s output_direct_sculpt_v2/QA/AINA_APPROVED_VS_DIRECT_SCULPT_v2.png
          test -s output_direct_sculpt_v2/QA/AINA_DIRECT_SCULPT_5VIEW_v2.png

      - name: Enforce direct-sculpt topology and transfer gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('output_direct_sculpt_v2/AINA_DIRECT_REFERENCE_SCULPT_v2_REPORT.json').read_text())
          assert report['direction'] == 'DIRECT_APPROVED_IMAGE_SPACE_SCULPT'
          assert report['automatic_identity_regression_used'] is False
          assert report['rain_face_used'] is False
          assert report['source_topology'] == 'FaceVerse V4 preserved vertex order'
          assert report['vertices'] == 19546
          assert report['triangles'] == 38792
          assert report['surface_vertices'] > 5000
          assert report['topology_changed'] is False
          assert report['vertex_order_preserved'] is True
          assert report['neutral_displacement_saved'] is True
          assert report['expression_transfer_ready'] is True
          assert report['total_neutral_displacement_max_m'] <= 0.0101
          assert report['identity_lock'] is False
          assert report['visual_identity_lock'] is False
          assert report['production_release'] is False
          assert report['candidate'] is True
          assert report['vrm_exported'] is False
          print(json.dumps({
              'surface_vertices': report['surface_vertices'],
              'landmark_rmse_m': report['final_68_landmark_rmse_m'],
              'max_displacement_m': report['total_neutral_displacement_max_m'],
              'rms_displacement_m': report['total_neutral_displacement_rms_m'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-DIRECT-REFERENCE-SCULPT-V2
          path: |
            output_direct_sculpt_v2/**
            output_direct_sculpt_v2_build.log
            source_v1/artifact_id.txt
          if-no-files-found: error
          retention-days: 30
