name: AINA Final Production Release

on:
  push:
    branches: [build/aina-v10-first-fit]
    paths:
      - src/blender/aina_vrm_addon_runtime.py
      - src/blender/aina_final_vrm_release_runtime.py
      - src/blender/aina_final_vrm_reimport_runtime.py
      - src/blender/aina_final_vrm_release.py
      - src/blender/aina_final_vrm_assembly.py
      - src/blender/aina_final_vrm_reimport_qa.py
      - src/sculpt_aina_v155_identity.py
      - src/finalize_aina_v155_lock.py
      - src/converge_aina_v155_release_gate.py
      - src/render_aina_v155_qa.py
      - references/AINA_APPROVED_FRONT_V2.jpg.b64
      - references/AINA_APPROVED_3Q.jpg.b64
      - references/AINA_APPROVED_SIDE.jpg.b64
      - references/AINA_TARGET_3DDFA_SPARSE_68.json
      - .github/workflows/build_aina_final_production.yml
  workflow_dispatch:

concurrency:
  group: aina-final-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install identity geometry runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils ca-certificates git libegl1 libgl1 libgl1-mesa-dri libosmesa6 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libice6
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy opencv-python-headless onnxruntime trimesh pillow mediapipe==0.10.21 vtk requests tqdm
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Materialize approved AINA references and FaceVerse
        run: |
          set -euo pipefail
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
          git clone --depth 1 https://github.com/Mrkomiljon/faceverse-onnx.git vendor/faceverse-onnx
          (cd vendor/faceverse-onnx && python download_models.py --models faceverse_v4_2.npy faceverse_resnet50_float32.onnx)

      - name: Converge and hard-lock the existing v15.5 real face
        run: |
          set -euo pipefail
          python src/fit_aina_faceverse_v124_axisfix.py --front references/AINA_APPROVED_FRONT.jpg --three-quarter references/AINA_APPROVED_3Q.jpg --front-landmarks references/AINA_TARGET_3DDFA_SPARSE_68.json --out output_faceverse_v124
          python src/sculpt_aina_faceverse_v125_residual.py --base-full output_faceverse_v124/AINA_FACEVERSE_FULL_v12.4_AXISFIX.obj --front references/AINA_APPROVED_FRONT.jpg --faceverse-data vendor/faceverse-onnx/data/faceverse_v4_2.npy --out output_faceverse_v125
          python src/sculpt_aina_v155_identity.py --base output_faceverse_v125/AINA_FACEVERSE_FULL_v12.5_DENSE_RESIDUAL.obj --out output_v155
          python src/finalize_aina_v155_lock.py --base output_v155/AINA_FACEVERSE_FULL_v15.5_CLEAN_IDENTITY.obj --target-landmarks references/AINA_TARGET_3DDFA_SPARSE_68.json --out output_locked || test -s output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj
          cp output_locked/AINA_FACEVERSE_v15.5_REPORT.json output_locked/AINA_FACEVERSE_v15.5_PRECONVERGENCE_REPORT.json
          python src/converge_aina_v155_release_gate.py --mesh output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj --target-landmarks references/AINA_TARGET_3DDFA_SPARSE_68.json --prior-report output_locked/AINA_FACEVERSE_v15.5_PRECONVERGENCE_REPORT.json --out output_locked
          python src/render_aina_v155_qa.py --clay output_locked/AINA_FACEVERSE_IDENTITY_CLAY_v15.5_LOCKED.obj --front references/AINA_APPROVED_FRONT.jpg --q3 references/AINA_APPROVED_3Q.jpg --side references/AINA_APPROVED_SIDE.jpg --out output_locked/QA
          python - <<'PY'
          import json
          d=json.load(open('output_locked/AINA_FACEVERSE_v15.5_REPORT.json'))
          assert d.get('identity_lock') is True, d
          assert all(d.get('checks',{}).values()), d
          assert d.get('front_landmark_rmse_px',999) <= 1.10, d
          assert d.get('front_landmark_max_px',999) <= 3.0, d
          print('AINA_V15_5_IDENTITY_LOCK=TRUE')
          PY

      - name: Install Blender 4.5 LTS and VRM Addon source
        run: |
          set -euo pipefail
          mkdir -p .runtime/blender
          found=''
          for v in 4.5.12 4.5.11 4.5.10 4.5.9 4.5.8 4.5.7 4.5.6 4.5.5 4.5.4 4.5.3 4.5.2 4.5.1 4.5.0; do
            url="https://download.blender.org/release/Blender4.5/blender-${v}-linux-x64.tar.xz"
            if curl -fL --retry 2 --connect-timeout 20 -o .runtime/blender.tar.xz "$url"; then found="$v"; break; fi
          done
          test -n "$found"
          tar -xf .runtime/blender.tar.xz -C .runtime/blender --strip-components=1
          echo "BLENDER=$PWD/.runtime/blender/blender" >> "$GITHUB_ENV"
          echo "BLENDER_PATCH=$found" >> "$GITHUB_ENV"
          .runtime/blender/blender --version
          git clone --depth 1 --branch v4.5.0 https://github.com/saturday06/VRM-Addon-for-Blender.git vendor/VRM-Addon-for-Blender

      - name: Assemble final AINA MASTER and export VRM 1.0
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python src/blender/aina_final_vrm_release_runtime.py -- --face output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj --identity-report output_locked/AINA_FACEVERSE_v15.5_REPORT.json --out output_final
          test -s output_final/AINA_MASTER.blend
          test -s output_final/AINA.vrm
          test $(stat -c%s output_final/AINA.vrm) -ge 100000

      - name: Reimport final AINA VRM into a clean Blender scene
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python src/blender/aina_final_vrm_reimport_runtime.py -- --vrm output_final/AINA.vrm --out output_final
          test -s output_final/AINA_REIMPORT_CHECK.blend
          test -s output_final/QA/AINA_VRM_REIMPORT_QA.json

      - name: Hard final production gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, os
          root=pathlib.Path('output_final')
          ident=json.load(open('output_locked/AINA_FACEVERSE_v15.5_REPORT.json'))
          required=[
              root/'AINA_MASTER.blend', root/'AINA.vrm', root/'AINA_REIMPORT_CHECK.blend',
              root/'Preview'/'AINA_PORTRAIT_FRONT.png', root/'Preview'/'AINA_PORTRAIT_3Q.png', root/'Preview'/'AINA_FULL_BODY_FRONT.png',
              root/'QA'/'AINA_FINAL_ASSEMBLY_QA.json', root/'QA'/'AINA_VRM_REIMPORT_QA.json',
          ]
          missing=[str(p) for p in required if not p.exists() or p.stat().st_size==0]
          if missing: raise SystemExit('Missing final production files: '+repr(missing))
          assembly=json.load(open(root/'QA'/'AINA_FINAL_ASSEMBLY_QA.json'))
          reimport=json.load(open(root/'QA'/'AINA_VRM_REIMPORT_QA.json'))
          checks={
              'identity_lock': ident.get('identity_lock') is True and all(ident.get('checks',{}).values()),
              'assembly_pass': assembly.get('assembly_pass') is True,
              'shape_controls_52': assembly.get('shape_control_count') == 52,
              'vrm_presets_18': assembly.get('vrm_preset_count') == 18,
              'look_at': bool(assembly.get('look_at')),
              'spring_bones': assembly.get('spring_bone_count',0) >= 3,
              'reimport_pass': reimport.get('pass') is True and all(reimport.get('checks',{}).values()),
              'vrm_size': (root/'AINA.vrm').stat().st_size >= 100000,
              'front_identity_rmse': ident.get('front_landmark_rmse_px',999) <= 1.10,
              'front_identity_max': ident.get('front_landmark_max_px',999) <= 3.0,
          }
          if not all(checks.values()): raise SystemExit('AINA final production gate failed: '+repr(checks))
          gate={
              'pass':True,'checks':checks,'blender':os.environ.get('BLENDER_PATCH','unknown'),
              'identity_rmse_px':ident.get('front_landmark_rmse_px'),'identity_max_px':ident.get('front_landmark_max_px'),
              'vrm_bytes':(root/'AINA.vrm').stat().st_size,
          }
          (root/'QA'/'AINA_FINAL_RELEASE_GATE.json').write_text(json.dumps(gate,indent=2),encoding='utf-8')
          print(json.dumps(gate,indent=2)); print('AINA_FINAL_PRODUCTION_GATE=PASS')
          PY

      - name: Package final production deliverable
        run: |
          set -euo pipefail
          rm -rf release_package
          mkdir -p release_package/QA
          cp output_final/AINA_MASTER.blend release_package/
          cp output_final/AINA.vrm release_package/
          cp output_final/AINA_REIMPORT_CHECK.blend release_package/
          cp -r output_final/Textures release_package/
          cp -r output_final/Preview release_package/
          cp -r output_final/QA/. release_package/QA/
          cp output_locked/AINA_FACEVERSE_v15.5_REPORT.json release_package/QA/AINA_FACE_IDENTITY_LOCK.json
          cp -r output_locked/QA release_package/QA/FaceIdentityViews
          cp output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.glb release_package/
          cp output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj release_package/
          (cd release_package && sha256sum AINA_MASTER.blend AINA.vrm AINA_REIMPORT_CHECK.blend AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.glb AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj > SHA256SUMS.txt)

      - name: Upload final AINA production release
        uses: actions/upload-artifact@v4
        with:
          name: AINA-FINAL-PRODUCTION-RELEASE
          path: release_package/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload final build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AINA-FINAL-PRODUCTION-DIAGNOSTICS
          path: |
            output_locked/**
            output_final/**
          if-no-files-found: warn
          retention-days: 14
