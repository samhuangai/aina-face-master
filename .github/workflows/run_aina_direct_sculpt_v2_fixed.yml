name: Run AINA Direct Sculpt v2 Fixed

on:
  push:
    branches: [aina-identity-master-v1-source]
    paths:
      - .github/workflows/run_aina_direct_sculpt_v2_fixed.yml
      - RUN_AINA_DIRECT_SCULPT_V2_FIXED
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-direct-sculpt-v2-fixed
  cancel-in-progress: true

jobs:
  sculpt:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      MPLBACKEND: Agg
    steps:
      - name: Checkout orchestration branch
        uses: actions/checkout@v4

      - name: Checkout complete direct-sculpt source branch
        uses: actions/checkout@v4
        with:
          repository: samhuangai/aina-face-master
          ref: ci/aina-direct-sculpt-v2-run
          path: direct
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install fixed direct-sculpt runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy trimesh matplotlib pillow requests onnxruntime tqdm
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Materialize approved AINA references
        run: |
          set -euo pipefail
          cd direct
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
          test -s references/AINA_TARGET_3DDFA_SPARSE_68.json
          test -s references/AINA_APPROVED_FRONT.jpg
          test -s references/AINA_APPROVED_3Q.jpg
          test -s references/AINA_APPROVED_SIDE.jpg

      - name: Download latest successful expression-capable FaceVerse transfer
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, os, shutil, zipfile
          from pathlib import Path
          import requests
          repo = os.environ['GITHUB_REPOSITORY']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          name = 'AINA-CUSTOM-IDENTITY-HEAD-V1'
          r = requests.get(f'https://api.github.com/repos/{repo}/actions/artifacts?name={name}&per_page=100', headers=headers, timeout=60)
          r.raise_for_status()
          items = [x for x in r.json().get('artifacts', []) if not x.get('expired')]
          if not items:
              raise SystemExit(f'No unexpired {name} artifact')
          art = max(items, key=lambda x: x['id'])
          z = requests.get(art['archive_download_url'], headers=headers, timeout=300, allow_redirects=True)
          z.raise_for_status()
          root = Path('artifact_custom')
          if root.exists(): shutil.rmtree(root)
          root.mkdir()
          with zipfile.ZipFile(io.BytesIO(z.content)) as archive:
              archive.extractall(root)
          matches = list(root.rglob('AINA_CUSTOM_HEAD_TRANSFER_v1.npz'))
          if not matches: raise FileNotFoundError('AINA_CUSTOM_HEAD_TRANSFER_v1.npz')
          stable = Path('direct/source_v1')
          stable.mkdir(parents=True, exist_ok=True)
          shutil.copy2(matches[0], stable / 'AINA_CUSTOM_HEAD_TRANSFER_v1.npz')
          (stable / 'artifact_id.txt').write_text(str(art['id']), encoding='utf-8')
          print({'artifact_id': art['id'], 'size': art['size_in_bytes']})
          PY
          test -s direct/source_v1/AINA_CUSTOM_HEAD_TRANSFER_v1.npz

      - name: Fetch FaceVerse V4 expression topology and landmark indices
        run: |
          set -euo pipefail
          cd direct
          rm -rf vendor/faceverse-onnx
          git clone --depth 1 https://github.com/Mrkomiljon/faceverse-onnx.git vendor/faceverse-onnx
          cd vendor/faceverse-onnx
          python download_models.py --models faceverse_v4_2.npy
          test -s data/faceverse_v4_2.npy
          cd ../../..

      - name: Sculpt actual FaceVerse mesh against approved AINA views
        run: |
          set -euo pipefail
          cd direct
          python src/sculpt_aina_direct_reference_v2.py 2>&1 | tee output_direct_sculpt_v2_build.log
          test -s output_direct_sculpt_v2/AINA_DIRECT_REFERENCE_HEAD_FULL_v2.glb
          test -s output_direct_sculpt_v2/AINA_DIRECT_REFERENCE_HEAD_SURFACE_v2.obj
          test -s output_direct_sculpt_v2/AINA_DIRECT_REFERENCE_TRANSFER_v2.npz
          test -s output_direct_sculpt_v2/QA/AINA_APPROVED_VS_DIRECT_SCULPT_v2.png
          test -s output_direct_sculpt_v2/QA/AINA_DIRECT_SCULPT_5VIEW_v2.png

      - name: Copy fixed head package
        run: |
          set -euo pipefail
          rm -rf output
          mkdir output
          cp -a direct/output_direct_sculpt_v2/. output/
          cp direct/output_direct_sculpt_v2_build.log output/
          cp direct/source_v1/artifact_id.txt output/
          find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload fixed AINA direct-sculpt head
        uses: actions/upload-artifact@v4
        with:
          name: AINA-DIRECT-SCULPT-V2-FIXED
          path: output/**
          if-no-files-found: error
          retention-days: 30
