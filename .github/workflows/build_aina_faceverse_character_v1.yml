name: Build AINA FaceVerse Character Source v1

on:
  push:
    branches: [aina-identity-master-v1-source]
    paths:
      - src/reshape_aina_faceverse_v3.py
      - src/blender/build_aina_faceverse_character_v1.py
      - .github/workflows/build_aina_faceverse_character_v1.yml
      - RUN_AINA_FACEVERSE_CHARACTER_V1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-faceverse-character-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      MPLBACKEND: Agg
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - name: Checkout AINA source branch
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install identity reshaping dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy trimesh matplotlib pillow requests

      - name: Download latest successful FaceVerse transfer artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import os
          import shutil
          import zipfile
          from pathlib import Path
          import requests

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          name = 'AINA-DIRECT-SCULPT-V2-FIXED-DIAGNOSTICS'
          response = requests.get(
              f'https://api.github.com/repos/{repository}/actions/artifacts?name={name}&per_page=100',
              headers=headers,
              timeout=60,
          )
          response.raise_for_status()
          artifacts = [item for item in response.json().get('artifacts', []) if not item.get('expired')]
          if not artifacts:
              raise SystemExit(f'No unexpired {name} artifact is available')
          artifact = max(artifacts, key=lambda item: item['id'])
          archive = requests.get(
              artifact['archive_download_url'],
              headers=headers,
              timeout=300,
              allow_redirects=True,
          )
          archive.raise_for_status()
          root = Path('source_transfer_artifact')
          if root.exists():
              shutil.rmtree(root)
          root.mkdir()
          with zipfile.ZipFile(io.BytesIO(archive.content)) as zf:
              zf.extractall(root)
          matches = list(root.rglob('AINA_DIRECT_REFERENCE_TRANSFER_v2.npz'))
          if not matches:
              raise FileNotFoundError('AINA_DIRECT_REFERENCE_TRANSFER_v2.npz')
          stable = Path('source')
          stable.mkdir(exist_ok=True)
          shutil.copy2(matches[0], stable / 'AINA_DIRECT_REFERENCE_TRANSFER_v2.npz')
          (stable / 'source_artifact_id.txt').write_text(str(artifact['id']), encoding='utf-8')
          print({'artifact_id': artifact['id'], 'size': artifact['size_in_bytes']})
          PY
          test -s source/AINA_DIRECT_REFERENCE_TRANSFER_v2.npz

      - name: Rebuild AINA identity with corrected landmark handedness
        run: |
          set -euo pipefail
          python src/reshape_aina_faceverse_v3.py \
            --input source/AINA_DIRECT_REFERENCE_TRANSFER_v2.npz \
            --out face_v3 \
            2>&1 | tee face_v3_build.log
          test -s face_v3/AINA_FACEVERSE_IDENTITY_TRANSFER_V3.npz
          test -s face_v3/AINA_FACEVERSE_IDENTITY_V3_FULL.glb
          test -s face_v3/AINA_FACEVERSE_IDENTITY_V3_SURFACE.obj
          test -s face_v3/AINA_FACEVERSE_IDENTITY_V3_REPORT.json

      - name: Install Blender 4.5.12 LTS and software-rendering runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libglx-mesa0 libosmesa6 libx11-6 libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libice6
          sudo ldconfig
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz \
            -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"

      - name: Build editable AINA Blender character source
        run: |
          set -euo pipefail
          mkdir -p output_aina_faceverse_v1/QA
          xvfb-run -a -s '-screen 0 1600x1200x24' "$BLENDER" \
            --background --factory-startup --python-exit-code 1 \
            --python src/blender/build_aina_faceverse_character_v1.py -- \
            --transfer face_v3/AINA_FACEVERSE_IDENTITY_TRANSFER_V3.npz \
            --out output_aina_faceverse_v1 \
            2>&1 | tee output_aina_faceverse_v1/QA/BLENDER_BUILD.log

      - name: Add corrected identity data and QA evidence to package
        run: |
          set -euo pipefail
          mkdir -p output_aina_faceverse_v1/IdentityV3 output_aina_faceverse_v1/IdentityV3_QA
          cp face_v3/AINA_FACEVERSE_IDENTITY_TRANSFER_V3.npz output_aina_faceverse_v1/IdentityV3/
          cp face_v3/AINA_FACEVERSE_IDENTITY_V3_FULL.glb output_aina_faceverse_v1/IdentityV3/
          cp face_v3/AINA_FACEVERSE_IDENTITY_V3_FULL.obj output_aina_faceverse_v1/IdentityV3/
          cp face_v3/AINA_FACEVERSE_IDENTITY_V3_SURFACE.glb output_aina_faceverse_v1/IdentityV3/
          cp face_v3/AINA_FACEVERSE_IDENTITY_V3_SURFACE.obj output_aina_faceverse_v1/IdentityV3/
          cp face_v3/AINA_FACEVERSE_IDENTITY_V3_REPORT.json output_aina_faceverse_v1/IdentityV3/
          if [ -d face_v3/QA ]; then cp -a face_v3/QA/. output_aina_faceverse_v1/IdentityV3_QA/; fi
          cp face_v3_build.log output_aina_faceverse_v1/QA/
          cp source/source_artifact_id.txt output_aina_faceverse_v1/QA/

      - name: Verify real source deliverables
        run: |
          set -euo pipefail
          test -s output_aina_faceverse_v1/AINA_IDENTITY_MASTER_FACEVERSE_v1.blend
          test -s output_aina_faceverse_v1/AINA_IDENTITY_MASTER_FACEVERSE_v1.glb
          test -s output_aina_faceverse_v1/AINA_IDENTITY_MASTER_FACEVERSE_v1.fbx
          test -s output_aina_faceverse_v1/AINA_SOURCE_MANIFEST.json
          test -s output_aina_faceverse_v1/Preview/AINA_FRONT.png
          test -s output_aina_faceverse_v1/Preview/AINA_THREE_QUARTER.png
          test -s output_aina_faceverse_v1/Preview/AINA_PROFILE.png
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('output_aina_faceverse_v1/AINA_SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['real_blend_source'] is True
          assert manifest['identity_lock'] is False
          assert manifest['visual_identity_lock'] is False
          assert manifest['production_release'] is False
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY
          find output_aina_faceverse_v1 -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Upload editable AINA FaceVerse package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AINA-IDENTITY-MASTER-FACEVERSE-V1
          path: output_aina_faceverse_v1/**
          if-no-files-found: warn
          retention-days: 30
