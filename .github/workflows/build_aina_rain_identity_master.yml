name: Build AINA Rain Identity Master

on:
  pull_request:
    branches: [ci/aina-identity-master-base]
    paths:
      - RUN_AINA_RAIN_IDENTITY_MASTER
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-rain-identity-master
  cancel-in-progress: true

jobs:
  rain_identity_master:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install landmark and image dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 pillow face-alignment

      - name: Materialize approved AINA references
        run: |
          set -euo pipefail
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
          test -s references/AINA_APPROVED_FRONT.jpg
          test -s references/AINA_APPROVED_3Q.jpg
          test -s references/AINA_APPROVED_SIDE.jpg
          test -s references/AINA_TARGET_3DDFA_SPARSE_68.json

      - name: Fetch Blender Studio Rain production GLB and attribution
        run: |
          set -euo pipefail
          mkdir -p source
          curl -fL --retry 4 \
            https://raw.githubusercontent.com/mnanimat/software_mnanimat3d/main/assets/characters/rain/rain-lumina.glb \
            -o source/rain-lumina.glb
          curl -fL --retry 4 \
            https://raw.githubusercontent.com/mnanimat/software_mnanimat3d/main/assets/characters/rain/ATTRIBUTION.md \
            -o source/RAIN_ATTRIBUTION.md || true
          test -s source/rain-lumina.glb

      - name: Install Blender 4.5.12 LTS and software rendering runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libglx-mesa0 libosmesa6 libx11-6 libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libice6
          sudo ldconfig
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz \
            -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"

      - name: Import the real Rain rig and render neutral source views
        run: |
          set +e
          mkdir -p output_rain_identity/QA output_rain_identity/Preview output_rain_identity/Source
          xvfb-run -a -s '-screen 0 1600x900x24' "$BLENDER" \
            --background --factory-startup --python-exit-code 1 \
            --python src/blender/aina_rain_identity_master.py -- \
            --stage source \
            --source source/rain-lumina.glb \
            --out output_rain_identity \
            2>&1 | tee output_rain_identity/QA/AINA_RAIN_SOURCE_BUILD.log
          code=${PIPESTATUS[0]}
          echo "$code" > output_rain_identity/QA/AINA_RAIN_SOURCE_EXIT.txt
          exit "$code"

      - name: Extract approved and real-model multi-view landmarks
        run: |
          set -euo pipefail
          python src/extract_aina_rain_identity_landmarks.py \
            --approved-front references/AINA_APPROVED_FRONT.jpg \
            --approved-q3 references/AINA_APPROVED_3Q.jpg \
            --approved-side references/AINA_APPROVED_SIDE.jpg \
            --model-front output_rain_identity/Source/AINA_RAIN_SOURCE_FRONT.png \
            --model-q3 output_rain_identity/Source/AINA_RAIN_SOURCE_THREE_QUARTER.png \
            --model-side output_rain_identity/Source/AINA_RAIN_SOURCE_SIDE.png \
            --front-target references/AINA_TARGET_3DDFA_SPARSE_68.json \
            --out output_rain_identity/QA
          test -s output_rain_identity/QA/AINA_RAIN_IDENTITY_LANDMARKS.json

      - name: Reconstruct the actual Rain head Mesh as AINA
        run: |
          set +e
          xvfb-run -a -s '-screen 0 1600x900x24' "$BLENDER" \
            output_rain_identity/AINA_RAIN_IDENTITY_SOURCE.blend \
            --background --python-exit-code 1 \
            --python src/blender/aina_rain_identity_master.py -- \
            --stage fit \
            --landmarks output_rain_identity/QA/AINA_RAIN_IDENTITY_LANDMARKS.json \
            --out output_rain_identity \
            2>&1 | tee output_rain_identity/QA/AINA_RAIN_IDENTITY_MASTER_BUILD.log
          code=${PIPESTATUS[0]}
          echo "$code" > output_rain_identity/QA/AINA_RAIN_IDENTITY_MASTER_EXIT.txt
          exit "$code"

      - name: Build approved-reference and actual-Mesh review sheets
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('output_rain_identity')
          pairs = [
              ('references/AINA_APPROVED_FRONT.jpg', root/'Preview/AINA_RAIN_IDENTITY_MASTER_FRONT.png', 'FRONT'),
              ('references/AINA_APPROVED_3Q.jpg', root/'Preview/AINA_RAIN_IDENTITY_MASTER_THREE_QUARTER.png', '3Q'),
              ('references/AINA_APPROVED_SIDE.jpg', root/'Preview/AINA_RAIN_IDENTITY_MASTER_SIDE.png', 'SIDE'),
          ]
          panels=[]
          for ref_path, model_path, label in pairs:
              ref=Image.open(ref_path).convert('RGB'); model=Image.open(model_path).convert('RGB')
              ref.thumbnail((430,430)); model.thumbnail((430,430))
              panel=Image.new('RGB',(900,480),'white')
              panel.paste(ref,((440-ref.width)//2,6))
              panel.paste(model,(455+(440-model.width)//2,6))
              draw=ImageDraw.Draw(panel)
              draw.text((10,450),f'APPROVED AINA {label}',fill='black')
              draw.text((465,450),f'REAL RAIN-MESH AINA {label}',fill='black')
              panels.append(panel)
          sheet=Image.new('RGB',(900,480*3),'white')
          for i,panel in enumerate(panels): sheet.paste(panel,(0,i*480))
          sheet.save(root/'QA/AINA_APPROVED_VS_RAIN_IDENTITY_MASTER.png')

          before=Image.open(root/'Source/AINA_RAIN_SOURCE_FRONT.png').convert('RGB')
          after=Image.open(root/'Preview/AINA_RAIN_IDENTITY_MASTER_FRONT.png').convert('RGB')
          clay=Image.open(root/'Preview/AINA_RAIN_IDENTITY_MASTER_CLAY_FRONT.png').convert('RGB')
          items=[(before,'RAIN SOURCE'),(after,'AINA BEAUTY'),(clay,'AINA CLAY')]
          compare=Image.new('RGB',(480*3,520),'white')
          for i,(image,label) in enumerate(items):
              image.thumbnail((460,460)); compare.paste(image,(i*480+(480-image.width)//2,5)); ImageDraw.Draw(compare).text((i*480+10,490),label,fill='black')
          compare.save(root/'QA/AINA_RAIN_IDENTITY_BEFORE_AFTER.png')

          expressions=sorted((root/'Preview').glob('AINA_RAIN_IDENTITY_MASTER_*.png'))
          expressions=[p for p in expressions if any(token in p.stem for token in ('HAPPY','BLINK','AA','SAD'))]
          if expressions:
              expr_sheet=Image.new('RGB',(430*len(expressions),470),'white')
              for i,path in enumerate(expressions):
                  image=Image.open(path).convert('RGB'); image.thumbnail((410,410)); expr_sheet.paste(image,(i*430+(430-image.width)//2,5)); ImageDraw.Draw(expr_sheet).text((i*430+8,438),path.stem,fill='black')
              expr_sheet.save(root/'QA/AINA_RAIN_IDENTITY_EXPRESSION_SHEET.png')
          PY
          test -s output_rain_identity/QA/AINA_APPROVED_VS_RAIN_IDENTITY_MASTER.png
          test -s output_rain_identity/QA/AINA_RAIN_IDENTITY_BEFORE_AFTER.png

      - name: Enforce topology, preservation and candidate gates
        run: |
          set -euo pipefail
          for file in \
            AINA_RAIN_IDENTITY_SOURCE.blend \
            AINA_RAIN_IDENTITY_MASTER_CANDIDATE.blend \
            AINA_RAIN_IDENTITY_MASTER_CANDIDATE.glb; do
              test -s "output_rain_identity/$file"
          done
          for file in \
            AINA_RAIN_IDENTITY_MASTER_FRONT.png \
            AINA_RAIN_IDENTITY_MASTER_THREE_QUARTER.png \
            AINA_RAIN_IDENTITY_MASTER_SIDE.png \
            AINA_RAIN_IDENTITY_MASTER_CLAY_FRONT.png \
            AINA_RAIN_IDENTITY_MASTER_CLAY_THREE_QUARTER.png \
            AINA_RAIN_IDENTITY_MASTER_CLAY_SIDE.png; do
              test -s "output_rain_identity/Preview/$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path('output_rain_identity/QA/AINA_RAIN_IDENTITY_SOURCE_REPORT.json').read_text())
          report=json.loads(Path('output_rain_identity/QA/AINA_RAIN_IDENTITY_MASTER_REPORT.json').read_text())
          assert source['real_3d_model'] is True
          assert report['real_3d_model'] is True
          assert report['replacement_effect_art_generated'] is False
          assert report['topology_changed'] is False
          assert report['armature_preserved'] is True
          assert report['skin_weights_preserved'] is True
          assert report['identity_lock'] is False
          assert report['visual_identity_lock'] is False
          assert report['candidate'] is True
          assert report['vertices'] == source['skin_vertices']
          assert report['head_region_vertices'] > 800
          fitting=report['fitting']
          assert fitting['total_max_displacement_m'] < 0.060
          preservation=fitting['expression_preservation']
          assert preservation['shape_delta_preservation_max_m'] < 1e-5
          print(json.dumps({
              'skin_object': report['skin_object'],
              'vertices': report['vertices'],
              'head_region_vertices': report['head_region_vertices'],
              'available_views': fitting['available_views'],
              'final_metrics': fitting['final_metrics'],
              'total_max_displacement_m': fitting['total_max_displacement_m'],
              'shape_preservation': preservation,
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-RAIN-IDENTITY-MASTER
          path: |
            output_rain_identity/**
            source/RAIN_ATTRIBUTION.md
          if-no-files-found: error
          retention-days: 30
