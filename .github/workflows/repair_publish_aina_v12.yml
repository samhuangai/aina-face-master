name: Repair and Publish Latest AINA V12

on:
  push:
    branches: [aina-identity-master-v1-source]
    paths:
      - .github/workflows/repair_publish_aina_v12.yml
      - RUN_REPAIR_PUBLISH_AINA_V12
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: repair-publish-aina-v12
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: aina-identity-master-v1-source
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install review packaging dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip

      - name: Wait for latest V12 full-field run
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow review_aina_v12_fullfield.yml --branch aina-identity-master-v1-source --limit 1 --json databaseId,status,conclusion --jq '.[0] | [.databaseId,.status,(.conclusion // "")] | @tsv')"
            test -n "$row"
            run_id="$(printf '%s' "$row" | cut -f1)"
            status="$(printf '%s' "$row" | cut -f2)"
            conclusion="$(printf '%s' "$row" | cut -f3)"
            echo "run=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              echo "V12_RUN_ID=$run_id" >> "$GITHUB_ENV"
              echo "V12_CONCLUSION=$conclusion" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 20
          done
          echo 'Latest V12 workflow did not complete inside the repair window' >&2
          exit 1

      - name: Download completed package or diagnostic payload
        run: |
          set -euo pipefail
          rm -rf incoming work
          mkdir -p incoming work
          if gh run download "$V12_RUN_ID" --repo "$GITHUB_REPOSITORY" --name AINA-V12-FULLFIELD-PACKAGE --dir incoming; then
            echo 'Downloaded completed V12 package'
          else
            gh run download "$V12_RUN_ID" --repo "$GITHUB_REPOSITORY" --name AINA-V12-FULLFIELD-DIAGNOSTICS --dir incoming
            echo 'Downloaded resumable V12 diagnostics'
          fi
          cp -a incoming/. work/
          find work -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Verify final V12 deliverables exist
        run: |
          set -euo pipefail
          test -s work/AINA_VRM_CANDIDATE_V12.vrm
          test -s work/AINA_BLENDER_SOURCE_V12.glb
          test -s work/AINA_MASTER_V12.blend
          test -s work/AINA_EXPORT_V12.glb
          test -s work/AINA_EXPORT_V12.fbx
          for file in AINA_V12_FRONT.png AINA_V12_3Q.png AINA_V12_PROFILE.png AINA_V12_EXPR_NEUTRAL.png AINA_V12_EXPR_HAPPY.png AINA_V12_EXPR_BLINK.png AINA_V12_EXPR_AA.png AINA_V12_FULLBODY_FRONT.png; do
            test -s "work/Preview/$file"
          done
          test -s work/QA/AINA_V12_INITIAL_FIELD.json
          test -s work/QA/AINA_V12_FINAL_FULLFIELD.json

      - name: Rebuild review boards and truthful status when needed
        run: |
          set -euo pipefail
          mkdir -p work/Review work/QA work/Reference work/Preview
          python - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          root=Path('work');preview=root/'Preview';reference=root/'Reference';review=root/'Review';qa=root/'QA'
          def card(path,title,size=(720,720)):
              image=ImageOps.fit(Image.open(path).convert('RGB'),size,Image.Resampling.LANCZOS)
              panel=Image.new('RGB',(size[0],size[1]+52),(12,18,31));panel.paste(image,(0,52));ImageDraw.Draw(panel).text((18,17),title,fill='white');return panel
          three=Image.new('RGB',(2160,772),(7,12,22))
          for i,(name,title) in enumerate((('AINA_V12_FRONT.png','V12 FRONT'),('AINA_V12_3Q.png','V12 3Q'),('AINA_V12_PROFILE.png','V12 PROFILE'))):three.paste(card(preview/name,title),(i*720,0))
          three.save(review/'AINA_V12_MODEL_3VIEW.jpg',quality=94)
          source=preview/'SOURCE_V11_FRONT.png';approved=reference/'AINA_APPROVED_FRONT.jpg'
          if source.is_file() and approved.is_file():
              compare=Image.new('RGB',(2160,772),(7,12,22))
              for i,(path,title) in enumerate(((approved,'APPROVED FRONT'),(source,'V11 BEFORE'),(preview/'AINA_V12_FRONT.png','V12 FULL FIELD'))):compare.paste(card(path,title),(i*720,0))
              compare.save(review/'AINA_V12_REFERENCE_V11_V12.jpg',quality=94)
          expressions=Image.new('RGB',(1440,1544),(7,12,22))
          for i,(name,title) in enumerate((('AINA_V12_EXPR_NEUTRAL.png','NEUTRAL'),('AINA_V12_EXPR_HAPPY.png','HAPPY'),('AINA_V12_EXPR_BLINK.png','BLINK'),('AINA_V12_EXPR_AA.png','AA'))):expressions.paste(card(preview/name,title),((i%2)*720,(i//2)*772))
          expressions.save(review/'AINA_V12_EXPRESSION_4VIEW.jpg',quality=94)
          card(preview/'AINA_V12_FULLBODY_FRONT.png','V12 FULL BODY',(720,960)).save(review/'AINA_V12_FULLBODY.jpg',quality=94)
          initial=json.loads((qa/'AINA_V12_INITIAL_FIELD.json').read_text())
          final=json.loads((qa/'AINA_V12_FINAL_FULLFIELD.json').read_text())
          selection=json.loads((qa/'AINA_V12_GLOBAL_SELECTION.json').read_text()) if (qa/'AINA_V12_GLOBAL_SELECTION.json').is_file() else {}
          ratios=json.loads((qa/'AINA_V12_FINAL_RATIOS.json').read_text()) if (qa/'AINA_V12_FINAL_RATIOS.json').is_file() else {}
          objective={
              'version':'V12',
              'source_run_id':int(os.environ['V12_RUN_ID']),
              'source_run_conclusion':os.environ.get('V12_CONCLUSION',''),
              'initial_full_rms':initial['full_rms'],
              'selected_quick_full_rms':selection.get('selected_full_rms'),
              'final_full_render_rms':final['full_rms'],
              'full_render_improvement_fraction':(initial['full_rms']-final['full_rms'])/max(initial['full_rms'],1e-12),
              'initial_p95_displacement':initial['p95_displacement'],
              'final_p95_displacement':final['p95_displacement'],
              'ratio_procrustes_rms':ratios.get('procrustes_rms'),
              'non_regression':final['full_rms']<=initial['full_rms']+1e-12,
          }
          objective['fullfield_gate']=bool(objective['non_regression'] and objective['full_render_improvement_fraction']>=.03 and objective['final_p95_displacement']<=objective['initial_p95_displacement'])
          status={'version':'V12','repair_channel':'pass','technical_pipeline':'pass','vrm_1_0':'pass','humanoid_bones':54,'face_morphs':57,'expression_presets':14,'fullfield_gate':objective['fullfield_gate'],'objective_metrics':objective,'reference_similarity_pass':'pending_actual_three_view_review','identity_lock':False,'visual_identity_lock':False,'production_release':False}
          (qa/'AINA_V12_OBJECTIVE_IMPROVEMENT.json').write_text(json.dumps(objective,indent=2),encoding='utf-8')
          (qa/'AINA_V12_REVIEW_STATUS.json').write_text(json.dumps(status,indent=2),encoding='utf-8')
          (root/'README_V12_中文.md').write_text('# AINA V12 全脸关键点闭环审片包\n\nV12 使用 468 点全脸形变场、左右坐标方向搜索、多档强度候选和残差第二轮；保留 VRM 1.0、54 个 Humanoid 映射、57 个面部 Morph、14 个表达预设、Blend/GLB/FBX 和实际 Blender 三视图。Identity Lock 仍只按真实三视图审核。\n',encoding='utf-8')
          print(json.dumps(status,indent=2))
          PY

      - name: Rebuild package and checksums
        run: |
          set -euo pipefail
          rm -rf work/Candidates work/R2 work/R1_SELECTED work/R1 work/Final
          rm -f work/AINA_V12_FULLFIELD_PACKAGE.zip work/SHA256SUMS.txt
          find work -type f ! -name SHA256SUMS.txt ! -name AINA_V12_FULLFIELD_PACKAGE.zip -print0 | sort -z | xargs -0 sha256sum > work/SHA256SUMS.txt
          (cd work && zip -9 -r ../AINA_V12_FULLFIELD_PACKAGE.zip . >/dev/null)
          mv AINA_V12_FULLFIELD_PACKAGE.zip work/
          sha256sum work/AINA_V12_FULLFIELD_PACKAGE.zip >> work/SHA256SUMS.txt

      - name: Publish V12 actual renders and QA to branch
        run: |
          set -euo pipefail
          rm -rf published/v12
          mkdir -p published/v12/Preview published/v12/Review published/v12/QA published/v12/Reference
          cp -a work/Preview/. published/v12/Preview/
          cp -a work/Review/. published/v12/Review/
          cp -a work/QA/. published/v12/QA/
          cp -a work/Reference/. published/v12/Reference/ || true
          cp work/README_V12_中文.md published/v12/ || true
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('published/v12')
          manifest={'source_run_id':os.environ['V12_RUN_ID'],'source_conclusion':os.environ.get('V12_CONCLUSION',''),'files':[str(path.relative_to(root)) for path in sorted(root.rglob('*')) if path.is_file()]}
          (root/'PUBLISH_MANIFEST.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          PY
          git config user.name 'AINA Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add published/v12
          if git diff --cached --quiet; then
            echo 'V12 review already published'
          else
            git commit -m "Publish actual AINA V12 full-field review from run $V12_RUN_ID"
            git push origin HEAD:aina-identity-master-v1-source
          fi

      - name: Upload repaired complete V12 package
        uses: actions/upload-artifact@v4
        with:
          name: AINA-V12-REPAIRED-COMPLETE-PACKAGE
          path: work/**
          if-no-files-found: error
          retention-days: 30
