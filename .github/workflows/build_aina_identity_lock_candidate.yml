name: Build AINA Real Identity Lock Candidate

on:
  pull_request:
    branches: [ci/aina-identity-master-base]
    paths:
      - RUN_AINA_IDENTITY_LOCK_CANDIDATE

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-real-identity-lock-candidate
  cancel-in-progress: true

jobs:
  identity_lock_candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@v4

      - name: Materialize approved AINA references
        run: |
          set -euo pipefail
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
          test -s references/AINA_APPROVED_FRONT.jpg
          test -s references/AINA_APPROVED_3Q.jpg
          test -s references/AINA_APPROVED_SIDE.jpg

      - name: Fetch the untouched CC0 Vitruvian FACS head
        run: |
          set -euo pipefail
          mkdir -p source
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/vitruvian_head.glb \
            -o source/vitruvian_head.glb
          test -s source/vitruvian_head.glb

      - name: Install Blender 4.5.12 LTS and software rendering runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libglx-mesa0 libosmesa6 libx11-6 libxi6 libxrender1 \
            libxfixes3 libxkbcommon0 libsm6 libice6
          sudo ldconfig
          curl -fL --retry 2 \
            https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz \
            -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"

      - name: Build the actual identity-lock candidate and real expressions
        run: |
          set +e
          mkdir -p output_identity_lock_candidate/Preview output_identity_lock_candidate/QA
          xvfb-run -a -s '-screen 0 1600x900x24' "$BLENDER" \
            --background --factory-startup --python-exit-code 1 \
            --python src/blender/aina_vitruvian_identity_lock_candidate.py -- \
            --head source/vitruvian_head.glb \
            --out output_identity_lock_candidate \
            2>&1 | tee output_identity_lock_candidate/QA/AINA_IDENTITY_LOCK_CANDIDATE_BUILD.log
          code=${PIPESTATUS[0]}
          echo "$code" > output_identity_lock_candidate/QA/AINA_IDENTITY_LOCK_CANDIDATE_EXIT.txt
          exit "$code"

      - name: Build approved-reference and expression review sheets
        if: success()
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          out = Path('output_identity_lock_candidate')
          preview = out / 'Preview'
          qa = out / 'QA'
          comparisons = [
              (Path('references/AINA_APPROVED_FRONT.jpg'), preview / 'AINA_IDENTITY_LOCK_CANDIDATE_FRONT.png', 'FRONT'),
              (Path('references/AINA_APPROVED_3Q.jpg'), preview / 'AINA_IDENTITY_LOCK_CANDIDATE_THREE_QUARTER.png', '3Q'),
              (Path('references/AINA_APPROVED_SIDE.jpg'), preview / 'AINA_IDENTITY_LOCK_CANDIDATE_SIDE.png', 'SIDE'),
          ]
          panels = []
          for reference_path, model_path, label in comparisons:
              reference = Image.open(reference_path).convert('RGB')
              model = Image.open(model_path).convert('RGB')
              reference.thumbnail((390, 390))
              model.thumbnail((390, 390))
              panel = Image.new('RGB', (800, 440), 'white')
              panel.paste(reference, ((395-reference.width)//2, 5))
              panel.paste(model, (405+(390-model.width)//2, 5))
              draw = ImageDraw.Draw(panel)
              draw.text((10, 410), f'APPROVED AINA {label}', fill='black')
              draw.text((415, 410), f'REAL IDENTITY CANDIDATE {label}', fill='black')
              panels.append(panel)
          sheet = Image.new('RGB', (800, 440 * len(panels)), 'white')
          for index, panel in enumerate(panels):
              sheet.paste(panel, (0, index * 440))
          sheet.save(qa / 'AINA_APPROVED_VS_IDENTITY_LOCK_CANDIDATE.png')

          names = ['FRONT', 'HAPPY', 'SAD', 'ANGRY', 'BLINK', 'AA', 'OU']
          expression_panels = []
          for name in names:
              image = Image.open(preview / f'AINA_IDENTITY_LOCK_CANDIDATE_{name}.png').convert('RGB')
              image.thumbnail((360, 360))
              panel = Image.new('RGB', (380, 400), 'white')
              panel.paste(image, ((380-image.width)//2, 5))
              ImageDraw.Draw(panel).text((10, 375), name, fill='black')
              expression_panels.append(panel)
          expression_sheet = Image.new('RGB', (380 * 4, 400 * 2), 'white')
          for index, panel in enumerate(expression_panels):
              expression_sheet.paste(panel, ((index % 4) * 380, (index // 4) * 400))
          expression_sheet.save(qa / 'AINA_IDENTITY_LOCK_CANDIDATE_EXPRESSION_SHEET.png')
          PY

      - name: Enforce real-model, topology and expression preservation gates
        if: success()
        run: |
          set -euo pipefail
          test -s output_identity_lock_candidate/AINA_IDENTITY_LOCK_CANDIDATE.blend
          test -s output_identity_lock_candidate/AINA_IDENTITY_LOCK_CANDIDATE.glb
          test -s output_identity_lock_candidate/QA/AINA_IDENTITY_LOCK_CANDIDATE_REPORT.json
          test -s output_identity_lock_candidate/QA/AINA_APPROVED_VS_IDENTITY_LOCK_CANDIDATE.png
          test -s output_identity_lock_candidate/QA/AINA_IDENTITY_LOCK_CANDIDATE_EXPRESSION_SHEET.png
          for view in FRONT THREE_QUARTER SIDE LEFT_45 RIGHT_45 HAPPY SAD ANGRY BLINK AA OU; do
            test -s "output_identity_lock_candidate/Preview/AINA_IDENTITY_LOCK_CANDIDATE_${view}.png"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output_identity_lock_candidate/QA/AINA_IDENTITY_LOCK_CANDIDATE_REPORT.json').read_text())
          assert report['real_3d_model'] is True
          assert report['replacement_effect_art_generated'] is False
          assert report['skin_topology_changed'] is False
          assert report['vertices'] == 17161
          assert report['triangles'] == 30500
          assert report['shape_key_count'] == 26
          assert report['expression_preservation']['shape_delta_preservation_max_m'] < 1.0e-5
          assert report['expression_preservation']['shape_delta_preservation_rms_m'] < 1.0e-6
          assert report['identity_lock'] is False
          assert report['visual_identity_lock'] is False
          assert report['vrm_exported'] is False
          print(json.dumps({
              'vertices': report['vertices'],
              'triangles': report['triangles'],
              'shape_key_count': report['shape_key_count'],
              'residual_max_m': report['candidate_residual']['max_residual_displacement_m'],
              'residual_rms_m': report['candidate_residual']['rms_residual_displacement_m'],
              'shape_delta_preservation_max_m': report['expression_preservation']['shape_delta_preservation_max_m'],
              'iris_vertex_count': report['candidate_eye_anatomy']['iris_vertex_count'],
              'real_brow_geometry': report['real_brow_geometry'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-REAL-IDENTITY-LOCK-CANDIDATE
          path: output_identity_lock_candidate/**
          if-no-files-found: error
          retention-days: 30
