name: AINA Female Asian Identity Reference Sample

on:
  pull_request:
    branches: [ci/aina-direct-mesh-base]
    paths:
      - RUN_AINA_FEMALE_SAMPLE

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-female-reference-sample
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install geometry and GNM runtime
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy trimesh tensorflow-cpu==2.20.0 etils[epath] h5py
      - name: Fetch Google GNM model data
        run: |
          git clone --depth 1 https://github.com/google/GNM.git vendor/GNM
          git -C vendor/GNM lfs install --local || true
          git -C vendor/GNM lfs pull || true
          test -s vendor/GNM/gnm/shape/data/semantic_sampler/identity_decoder_model.h5
      - name: Sample female Asian identities against approved AINA landmarks
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/GNM
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: python src/sample_female_asian_aina.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-FEMALE-ASIAN-REFERENCE-SAMPLES
          path: output_semantic_samples/**
          if-no-files-found: warn
          retention-days: 30
