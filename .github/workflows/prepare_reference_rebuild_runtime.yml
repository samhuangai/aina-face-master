name: Prepare AINA Reference Rebuild Runtime
on:
  push:
    branches: [aina-reference-rebuild-20260906]
    paths: [.github/workflows/prepare_reference_rebuild_runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download pinned official Blender runtime
        run: |
          set -euo pipefail
          mkdir output
          curl -fL --retry 2 --max-time 300 https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz -o output/blender-runtime.tar.xz
          sha256sum output/blender-runtime.tar.xz > output/blender-runtime.sha256
      - name: Upload runtime for the active sculpting session
        uses: actions/upload-artifact@v4
        with:
          name: AINA-REFERENCE-REBUILD-RUNTIME
          path: output/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
