name: Build AINA v13.3 Landmark Laplacian

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/rebuild_aina_v133_landmark_laplacian.py
      - .github/workflows/build_v133_landmark_laplacian.yml
      - references/AINA_TARGET_3DDFA_SPARSE_68.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy opencv-python-headless onnxruntime trimesh matplotlib pillow requests tqdm mediapipe==0.10.21 vtk
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Materialize references
        run: |
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
      - name: Fetch FaceVerse models
        run: |
          git clone --depth 1 https://github.com/Mrkomiljon/faceverse-onnx.git vendor/faceverse-onnx
          cd vendor/faceverse-onnx
          python download_models.py --models faceverse_v4_2.npy faceverse_resnet50_float32.onnx
      - name: Rebuild clean v12.4 base
        run: |
          python src/fit_aina_faceverse_v124_axisfix.py \
            --front references/AINA_APPROVED_FRONT.jpg \
            --three-quarter references/AINA_APPROVED_3Q.jpg \
            --front-landmarks references/AINA_TARGET_3DDFA_SPARSE_68.json \
            --out output_faceverse_v124
      - name: Rebuild smooth v12.5 base
        run: |
          python src/sculpt_aina_faceverse_v125_residual.py \
            --base-full output_faceverse_v124/AINA_FACEVERSE_FULL_v12.4_AXISFIX.obj \
            --front references/AINA_APPROVED_FRONT.jpg \
            --faceverse-data vendor/faceverse-onnx/data/faceverse_v4_2.npy \
            --out output_faceverse_v125
      - name: Build v13.3 landmark Laplacian identity
        run: |
          python src/rebuild_aina_v133_landmark_laplacian.py \
            --base-full output_faceverse_v125/AINA_FACEVERSE_FULL_v12.5_DENSE_RESIDUAL.obj \
            --faceverse-data vendor/faceverse-onnx/data/faceverse_v4_2.npy \
            --target68 references/AINA_TARGET_3DDFA_SPARSE_68.json \
            --front-ref references/AINA_APPROVED_FRONT.jpg \
            --q3-ref references/AINA_APPROVED_3Q.jpg \
            --out output_v133
      - name: Upload actual v13.3 mesh
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aina-face-master-v13.3-landmark-laplacian
          path: output_v133/**
          if-no-files-found: warn
          retention-days: 30
