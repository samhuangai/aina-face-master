name: Build AINA v12.5 Dense Residual FaceVerse

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/fit_aina_faceverse_v121_dense.py
      - src/fit_aina_faceverse_v123_similarity.py
      - src/fit_aina_faceverse_v124_axisfix.py
      - src/sculpt_aina_faceverse_v125_residual.py
      - .github/workflows/build_faceverse_v125_residual.yml
      - references/AINA_APPROVED_FRONT_V2.jpg.b64
      - references/AINA_APPROVED_3Q.jpg.b64
      - references/AINA_TARGET_3DDFA_SPARSE_68.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy opencv-python-headless onnxruntime trimesh matplotlib pillow requests tqdm mediapipe==0.10.21
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Materialize approved references
        run: |
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
      - name: Fetch FaceVerse V4 models
        run: |
          git clone --depth 1 https://github.com/Mrkomiljon/faceverse-onnx.git vendor/faceverse-onnx
          cd vendor/faceverse-onnx
          python download_models.py --models faceverse_v4_2.npy faceverse_resnet50_float32.onnx
      - name: Rebuild coherent v12.4 base
        run: |
          python src/fit_aina_faceverse_v124_axisfix.py \
            --front references/AINA_APPROVED_FRONT.jpg \
            --three-quarter references/AINA_APPROVED_3Q.jpg \
            --front-landmarks references/AINA_TARGET_3DDFA_SPARSE_68.json \
            --out output_faceverse_v124
      - name: Apply dense residual AINA sculpt
        run: |
          python src/sculpt_aina_faceverse_v125_residual.py \
            --base-full output_faceverse_v124/AINA_FACEVERSE_FULL_v12.4_AXISFIX.obj \
            --front references/AINA_APPROVED_FRONT.jpg \
            --faceverse-data vendor/faceverse-onnx/data/faceverse_v4_2.npy \
            --out output_faceverse_v125
      - name: Summarize
        if: always()
        run: |
          echo '## AINA FaceVerse v12.5 Dense Residual' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output_faceverse_v125/AINA_FACEVERSE_v12.5_REPORT.json ]; then
            cat output_faceverse_v125/AINA_FACEVERSE_v12.5_REPORT.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'v12.5 report missing; inspect logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload model and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aina-faceverse-v12.5-dense-residual
          path: |
            output_faceverse_v125/**
            output_faceverse_v124/AINA_FACEVERSE_v12.4_REPORT.json
          if-no-files-found: warn
          retention-days: 30
