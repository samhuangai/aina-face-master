name: Build AINA v11.4 Visual Proportions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/sculpt_aina_v1120_tps.py
      - src/sculpt_aina_v1140_visual_proportions.py
      - .github/workflows/build_v1140_visual_proportions.yml
      - references/AINA_APPROVED_FRONT_V2.jpg.b64
      - references/AINA_APPROVED_3Q.jpg.b64
      - references/AINA_APPROVED_SIDE.jpg.b64
      - references/AINA_TARGET_3DDFA_SPARSE_68.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install tensorflow-cpu==2.20.0 h5py
      - name: Fetch Google GNM
        run: |
          git clone --depth 1 https://github.com/google/GNM.git vendor/GNM
          git -C vendor/GNM lfs install --local || true
          git -C vendor/GNM lfs pull || true
      - name: Materialize approved references
        run: |
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
      - name: Rebuild stable v11.2 base
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/GNM:${{ github.workspace }}/src
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          python src/sculpt_aina_v1120_tps.py \
            --front references/AINA_APPROVED_FRONT.jpg \
            --three-quarter references/AINA_APPROVED_3Q.jpg \
            --side references/AINA_APPROVED_SIDE.jpg \
            --front-landmarks references/AINA_TARGET_3DDFA_SPARSE_68.json \
            --out output_v1120
      - name: Sculpt visual proportions
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/GNM:${{ github.workspace }}/src
        run: |
          python src/sculpt_aina_v1140_visual_proportions.py \
            --base-full output_v1120/AINA_FACE_MASTER_GNM_v11.2_TPS.obj \
            --base-skin output_v1120/AINA_FACE_MASTER_SKIN_CLAY_v11.2_TPS.obj \
            --front references/AINA_APPROVED_FRONT.jpg \
            --front-landmarks references/AINA_TARGET_3DDFA_SPARSE_68.json \
            --out output_v1140
      - name: Summarize
        if: always()
        run: |
          echo '## AINA Face Master v11.4 Visual Proportions' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output_v1140/AINA_v11.4_REPORT.json ]; then
            cat output_v1140/AINA_v11.4_REPORT.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'v11.4 report missing; inspect logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload model and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aina-face-master-v11.4-visual-proportions
          path: |
            output_v1140/**
            output_v1120/AINA_v11.2_REPORT.json
          if-no-files-found: warn
          retention-days: 30
