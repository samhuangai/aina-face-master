name: Build AINA Real 3D Visual Identity

# Full real-model visual QA. No replacement reference art is generated.
on:
  push:
    branches: [production/aina-visual-lock]
    paths:
      - src/blender/aina_visual_identity_assembly.py
      - src/blender/aina_visual_identity_runtime.py
      - src/blender/aina_visual_eye_system.py
      - src/blender/aina_visual_hair_system.py
      - .github/workflows/build_aina_visual_identity.yml
  workflow_dispatch:

concurrency:
  group: aina-real-3d-visual-identity
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Initialize status
        run: |
          mkdir -p qa
          printf '{"stage":"checkout","pass":false,"run_id":"%s","source_commit":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > qa/AINA_VISUAL_BUILD_STATUS.json
      - name: Download existing locked v15.5 real mesh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9275974352/zip" -o diag.zip
          unzip -q diag.zip -d diag
          test -s diag/output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj
          test -s diag/output_locked/AINA_FACEVERSE_v15.5_REPORT.json
      - name: Install Blender 4.5.12 LTS and render runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libosmesa6 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libice6
          curl -fL --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"
          git clone --depth 1 --branch v4.5.0 https://github.com/saturday06/VRM-Addon-for-Blender.git vendor/VRM-Addon-for-Blender
          ./blender/blender --version
      - name: Sculpt and assemble the actual real 3D model
        run: |
          set +e
          mkdir -p output_visual/QA output_visual/Preview
          "$BLENDER" --background --factory-startup --python-exit-code 1 \
            --python src/blender/aina_visual_identity_runtime.py -- \
            --face diag/output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj \
            --identity-report diag/output_locked/AINA_FACEVERSE_v15.5_REPORT.json \
            --out output_visual 2>&1 | tee qa/AINA_VISUAL_BLENDER.log
          code=${PIPESTATUS[0]}
          echo "$code" > qa/AINA_VISUAL_BLENDER_EXIT.txt
          exit "$code"
      - name: Record actual model geometry metrics
        if: success()
        run: |
          set -euo pipefail
          test -s output_visual/AINA_MASTER.blend
          test -s output_visual/QA/AINA_VISUAL_IDENTITY_QA.json
          for f in AINA_REAL_NEUTRAL_FRONT.png AINA_REAL_NEUTRAL_3Q.png AINA_REAL_HAPPY_FRONT.png AINA_REAL_SURPRISED_FRONT.png AINA_REAL_BLINK_FRONT.png AINA_REAL_AA_FRONT.png; do test -s "output_visual/Preview/$f"; done
          python3 - <<'PY'
          import json, pathlib
          q=pathlib.Path('output_visual/QA/AINA_VISUAL_IDENTITY_QA.json')
          d=json.loads(q.read_text()); d['build_pass']=True
          d['actual_preview_files']=sorted(p.name for p in pathlib.Path('output_visual/Preview').glob('AINA_REAL_*.png'))
          d['master_bytes']=pathlib.Path('output_visual/AINA_MASTER.blend').stat().st_size
          d['vrm_candidate_bytes']=pathlib.Path('output_visual/AINA.vrm').stat().st_size if pathlib.Path('output_visual/AINA.vrm').exists() else 0
          q.write_text(json.dumps(d,indent=2),encoding='utf-8'); print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-REAL-3D-VISUAL-IDENTITY
          path: |
            output_visual/AINA_MASTER.blend
            output_visual/AINA.vrm
            output_visual/Preview/**
            output_visual/QA/**
            qa/AINA_VISUAL_BLENDER.log
            qa/AINA_VISUAL_BLENDER_EXIT.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Publish exact visual build status
        if: always()
        env:
          VERIFY_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('output_visual'); log=Path('qa/AINA_VISUAL_BLENDER.log')
          previews=sorted(p.name for p in (root/'Preview').glob('AINA_REAL_*.png')) if (root/'Preview').exists() else []
          q=root/'QA'/'AINA_VISUAL_IDENTITY_QA.json'; exitf=Path('qa/AINA_VISUAL_BLENDER_EXIT.txt')
          code=int(exitf.read_text().strip()) if exitf.exists() else -1
          marker={'source_commit':os.environ.get('VERIFY_COMMIT',''),'run_id':os.environ.get('GITHUB_RUN_ID',''),'stage':'visual_build_passed' if code==0 and q.exists() else 'visual_build_failed','pass':code==0 and q.exists() and len(previews)>=6,'blender_exit':code,'preview_count':len(previews),'preview_files':previews,'master_bytes':(root/'AINA_MASTER.blend').stat().st_size if (root/'AINA_MASTER.blend').exists() else 0,'vrm_candidate_bytes':(root/'AINA.vrm').stat().st_size if (root/'AINA.vrm').exists() else 0,'log_tail':'\n'.join(log.read_text(errors='replace').splitlines()[-80:]) if log.exists() else ''}
          Path('qa').mkdir(exist_ok=True); Path('qa/AINA_VISUAL_BUILD_STATUS.json').write_text(json.dumps(marker,indent=2),encoding='utf-8'); print(json.dumps(marker,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/AINA_VISUAL_BUILD_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record AINA real 3D visual build status"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
