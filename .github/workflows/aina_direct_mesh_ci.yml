name: AINA Isolated Direct Mesh Visual QA

on:
  pull_request:
    branches: [ci/aina-direct-mesh-base]
    paths:
      - RUN_AINA_DIRECT_MESH

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-isolated-direct-mesh-visual
  cancel-in-progress: true

jobs:
  direct_mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - uses: actions/checkout@v4

      - name: Download locked AINA v15.5 source mesh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9275974352/zip" -o locked.zip
          unzip -q locked.zip -d locked
          test -s locked/output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj

      - name: Install Blender and Xvfb
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri libglx-mesa0 libosmesa6 \
            libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libice6
          sudo ldconfig
          curl -fL --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"
          xvfb-run -a ./blender/blender --version

      - name: Directly edit the real OBJ vertices
        run: |
          set -euo pipefail
          mkdir -p output_mesh output_quick
          xvfb-run -a "$BLENDER" --background --factory-startup --python-exit-code 1 \
            --python src/refine_aina_orbit_contour_neck.py -- \
            --mesh locked/output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj \
            --out output_mesh/AINA_FACEVERSE_FULL_v15.5_VISUAL_REFINED.obj \
            --report output_mesh/AINA_DIRECT_MESH_REFINEMENT_QA.json
          test -s output_mesh/AINA_FACEVERSE_FULL_v15.5_VISUAL_REFINED.obj
          test -s output_mesh/AINA_DIRECT_MESH_REFINEMENT_QA.json

      - name: Render the actual refined face without body or VRM overhead
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' "$BLENDER" --background --factory-startup --python-exit-code 1 \
            --python src/blender/aina_direct_mesh_quick_render.py -- \
            --face output_mesh/AINA_FACEVERSE_FULL_v15.5_VISUAL_REFINED.obj \
            --out output_quick
          test -s output_quick/AINA_DIRECT_REFINED_FRONT.png
          test -s output_quick/AINA_DIRECT_REFINED_3Q.png
          test -s output_quick/AINA_DIRECT_REFINED_HEAD_QA.blend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-DIRECT-MESH-NEUTRAL-QA
          path: |
            output_mesh/**
            output_quick/**
          if-no-files-found: warn
          retention-days: 14
