name: Build AINA Rain Approved Appearance Candidate

on:
  pull_request:
    branches: [ci/aina-rain-appearance-base]
    paths:
      - RUN_AINA_RAIN_APPEARANCE_CANDIDATE
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-rain-approved-appearance-candidate
  cancel-in-progress: true

jobs:
  appearance_candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install artifact and image dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Materialize approved AINA references
        run: |
          set -euo pipefail
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
          test -s references/AINA_APPROVED_FRONT.jpg
          test -s references/AINA_APPROVED_3Q.jpg
          test -s references/AINA_APPROVED_SIDE.jpg

      - name: Download verified Rain Identity Master v2
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import os
          import requests
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          response = requests.get(
              f'https://api.github.com/repos/{repository}/actions/artifacts',
              headers=headers,
              params={'name': 'AINA-RAIN-IDENTITY-MASTER-V2', 'per_page': 100},
              timeout=30,
          )
          response.raise_for_status()
          artifacts = sorted(
              [item for item in response.json().get('artifacts', []) if not item.get('expired')],
              key=lambda item: item['id'],
              reverse=True,
          )
          if not artifacts:
              raise SystemExit('No non-expired AINA-RAIN-IDENTITY-MASTER-V2 artifact is available')

          required = {
              'candidate.blend': 'AINA_RAIN_IDENTITY_MASTER_V2.blend',
              'candidate_report.json': 'AINA_RAIN_IDENTITY_MASTER_V2_REPORT.json',
          }
          selected = None
          selected_archive = None
          selected_members = None
          for artifact in artifacts:
              archive = requests.get(
                  artifact['archive_download_url'],
                  headers=headers,
                  timeout=240,
                  allow_redirects=True,
              )
              if not archive.ok:
                  continue
              try:
                  with zipfile.ZipFile(io.BytesIO(archive.content)) as zf:
                      members = {
                          destination: next(
                              (
                                  name for name in zf.namelist()
                                  if PurePosixPath(name).name == source
                              ),
                              None,
                          )
                          for destination, source in required.items()
                      }
              except zipfile.BadZipFile:
                  continue
              if all(members.values()):
                  selected = artifact
                  selected_archive = archive.content
                  selected_members = members
                  break

          if selected is None or selected_archive is None or selected_members is None:
              raise SystemExit('No complete successful Rain Identity Master v2 artifact contains the required BLEND and report')

          stable = Path('source_v2')
          if stable.exists():
              shutil.rmtree(stable)
          stable.mkdir()
          with zipfile.ZipFile(io.BytesIO(selected_archive)) as zf:
              for destination, member in selected_members.items():
                  with zf.open(member) as source, (stable / destination).open('wb') as target:
                      shutil.copyfileobj(source, target)
          (stable / 'artifact_id.txt').write_text(str(selected['id']))
          print({
              'artifact_id': selected['id'],
              'artifact_size': selected['size_in_bytes'],
              'members': selected_members,
          })
          PY
          test -s source_v2/candidate.blend
          test -s source_v2/candidate_report.json

      - name: Install Blender 4.5.12 LTS and software rendering runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libglx-mesa0 libosmesa6 libx11-6 libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libice6
          sudo ldconfig
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz \
            -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"

      - name: Build actual approved-appearance candidate on the same Rain Mesh
        run: |
          set +e
          mkdir -p output_rain_appearance/Preview output_rain_appearance/QA
          xvfb-run -a -s '-screen 0 1600x900x24' "$BLENDER" \
            source_v2/candidate.blend \
            --background --python-exit-code 1 \
            --python src/blender/aina_rain_appearance_candidate.py -- \
            --out output_rain_appearance \
            2>&1 | tee output_rain_appearance/QA/AINA_RAIN_APPEARANCE_BUILD.log
          code=${PIPESTATUS[0]}
          echo "$code" > output_rain_appearance/QA/AINA_RAIN_APPEARANCE_EXIT.txt
          exit "$code"

      - name: Build approved-reference and expression review sheets
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          output = Path('output_rain_appearance')
          preview = output / 'Preview'
          qa = output / 'QA'
          comparisons = [
              (Path('references/AINA_APPROVED_FRONT.jpg'), preview / 'AINA_RAIN_APPEARANCE_FRONT.png', 'FRONT'),
              (Path('references/AINA_APPROVED_3Q.jpg'), preview / 'AINA_RAIN_APPEARANCE_THREE_QUARTER.png', '3Q'),
              (Path('references/AINA_APPROVED_SIDE.jpg'), preview / 'AINA_RAIN_APPEARANCE_SIDE.png', 'SIDE'),
          ]
          panels = []
          for reference_path, model_path, label in comparisons:
              reference = Image.open(reference_path).convert('RGB')
              model = Image.open(model_path).convert('RGB')
              reference.thumbnail((430, 430))
              model.thumbnail((430, 430))
              panel = Image.new('RGB', (900, 480), 'white')
              panel.paste(reference, ((440 - reference.width) // 2, 6))
              panel.paste(model, (455 + (440 - model.width) // 2, 6))
              draw = ImageDraw.Draw(panel)
              draw.text((10, 450), f'APPROVED AINA {label}', fill='black')
              draw.text((465, 450), f'REAL RAIN APPEARANCE {label}', fill='black')
              panels.append(panel)
          sheet = Image.new('RGB', (900, 480 * len(panels)), 'white')
          for index, panel in enumerate(panels):
              sheet.paste(panel, (0, index * 480))
          sheet.save(qa / 'AINA_APPROVED_VS_RAIN_APPEARANCE.png')

          review_items = [
              ('NEUTRAL', preview / 'AINA_RAIN_APPEARANCE_FRONT.png'),
              ('HAPPY', preview / 'AINA_RAIN_APPEARANCE_HAPPY.png'),
              ('SAD', preview / 'AINA_RAIN_APPEARANCE_SAD.png'),
              ('BLINK', preview / 'AINA_RAIN_APPEARANCE_BLINK.png'),
              ('CLAY FRONT', preview / 'AINA_RAIN_APPEARANCE_CLAY_FRONT.png'),
              ('CLAY 3Q', preview / 'AINA_RAIN_APPEARANCE_CLAY_THREE_QUARTER.png'),
              ('CLAY SIDE', preview / 'AINA_RAIN_APPEARANCE_CLAY_SIDE.png'),
          ]
          review_panels = []
          for label, path in review_items:
              image = Image.open(path).convert('RGB')
              image.thumbnail((400, 400))
              panel = Image.new('RGB', (420, 440), 'white')
              panel.paste(image, ((420 - image.width) // 2, 5))
              ImageDraw.Draw(panel).text((10, 415), label, fill='black')
              review_panels.append(panel)
          review_sheet = Image.new('RGB', (1260, 1320), 'white')
          for index, panel in enumerate(review_panels):
              review_sheet.paste(panel, ((index % 3) * 420, (index // 3) * 440))
          review_sheet.save(qa / 'AINA_RAIN_APPEARANCE_EXPRESSION_AND_CLAY.png')
          PY
          test -s output_rain_appearance/QA/AINA_APPROVED_VS_RAIN_APPEARANCE.png
          test -s output_rain_appearance/QA/AINA_RAIN_APPEARANCE_EXPRESSION_AND_CLAY.png

      - name: Enforce same-Mesh, eye, hair and expression preservation gates
        run: |
          set -euo pipefail
          test -s output_rain_appearance/AINA_RAIN_APPROVED_APPEARANCE_CANDIDATE.blend
          test -s output_rain_appearance/AINA_RAIN_APPROVED_APPEARANCE_CANDIDATE.glb
          test -s output_rain_appearance/QA/AINA_RAIN_APPROVED_APPEARANCE_REPORT.json
          python - <<'PY'
          import json
          from pathlib import Path

          previous = json.loads(Path('source_v2/candidate_report.json').read_text())
          report = json.loads(Path('output_rain_appearance/QA/AINA_RAIN_APPROVED_APPEARANCE_REPORT.json').read_text())
          assert report['real_3d_model'] is True
          assert report['replacement_effect_art_generated'] is False
          assert report['skin_topology_changed'] is False
          assert report['armature_preserved'] is True
          assert report['skin_weights_preserved'] is True
          assert report['uvs_preserved'] is True
          assert report['vertices'] == previous['vertices'] == 6868
          assert report['triangles'] == previous['triangles'] == 12634
          assert report['source_vertices'] == report['vertices']
          assert report['source_triangles'] == report['triangles']
          preservation = report['shape_key_preservation']
          assert preservation['shape_key_count'] == 23
          assert preservation['shape_delta_preservation_max_m'] < 1.0e-5
          mirrored_sources = {item['source'] for item in report['bilateral_repair']['mirrored_components']}
          assert {'GEO-rain-eye_cornea', 'GEO-rain-eye_dots', 'GEO-rain-eyebrows', 'GEO-rain-eyelashes'} <= mirrored_sources
          assert len(report['eye_geometry']['created']) == 2
          assert all(item['iris'] and item['pupil'] and item['highlight'] for item in report['eye_geometry']['created'])
          assert any('hair_main' in name.lower() for name in report['silver_updo']['visible'])
          assert any('hair_strand' in name.lower() for name in report['silver_updo']['visible'])
          assert any('hair_ponytail' in name.lower() for name in report['silver_updo']['hidden'])
          assert report['identity_lock'] is False
          assert report['visual_identity_lock'] is False
          assert report['candidate'] is True
          assert report['vrm_exported'] is False
          print(json.dumps({
              'vertices': report['vertices'],
              'triangles': report['triangles'],
              'mirrored_sources': sorted(mirrored_sources),
              'eye_geometry': report['eye_geometry'],
              'silver_updo': report['silver_updo'],
              'shape_key_preservation': preservation,
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-RAIN-APPROVED-APPEARANCE-CANDIDATE
          path: |
            output_rain_appearance/**
            source_v2/artifact_id.txt
          if-no-files-found: error
          retention-days: 30
