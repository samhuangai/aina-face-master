name: Build AINA Face Master

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - RUN_BUILD_PR
      - src/**
      - requirements.txt
      - references/**
      - .github/workflows/build_aina.yml

permissions:
  contents: read

jobs:
  reconstruct-aina-dense-face:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout AINA repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install reconstruction dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy==1.26.4 scipy opencv-python-headless matplotlib imageio imageio-ffmpeg pyyaml tqdm cython scikit-image
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Materialize approved AINA front reference
        run: |
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > AINA_APPROVED_FRONT.jpg
          python - <<'PY'
          from PIL import Image
          im=Image.open('AINA_APPROVED_FRONT.jpg'); im.load(); print(im.size, im.mode)
          PY

      - name: Fetch and build 3DDFA V2
        run: |
          git clone --depth 1 https://github.com/cleardusk/3DDFA_V2.git vendor/3DDFA_V2
          if command -v git-lfs >/dev/null 2>&1; then
            git -C vendor/3DDFA_V2 lfs install --local || true
            git -C vendor/3DDFA_V2 lfs pull || true
          fi
          cd vendor/3DDFA_V2
          sh ./build.sh
          ls -lh weights models configs | head -100

      - name: Reconstruct AINA dense 3D face
        run: |
          mkdir -p output_3ddfa
          cp AINA_APPROVED_FRONT.jpg vendor/3DDFA_V2/examples/inputs/aina_approved_front.jpg
          cd vendor/3DDFA_V2
          python demo.py -f examples/inputs/aina_approved_front.jpg -m cpu -o obj --show_flag false
          python demo.py -f examples/inputs/aina_approved_front.jpg -m cpu -o ply --show_flag false
          find examples/results -maxdepth 1 -type f -name 'aina_approved_front*' -print -exec ls -lh {} \;
          cp examples/results/aina_approved_front* "$GITHUB_WORKSPACE/output_3ddfa/" || true

      - name: Verify reconstructed geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import trimesh
          out=Path('output_3ddfa')
          fs=list(out.glob('*.obj'))+list(out.glob('*.ply'))
          if not fs: raise SystemExit('No reconstructed OBJ/PLY produced')
          for p in fs:
              m=trimesh.load(p, process=False)
              print(p, 'vertices=',len(m.vertices),'faces=',len(m.faces),'bounds=',m.bounds.tolist())
          PY

      - name: Upload dense reconstruction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aina-3ddfa-dense-reconstruction
          path: output_3ddfa/**
          if-no-files-found: warn
          retention-days: 30
