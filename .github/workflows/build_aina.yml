name: Build AINA Face Master

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - RUN_BUILD_PR
      - src/**
      - requirements.txt
      - references/**
      - .github/workflows/build_aina.yml

permissions:
  contents: read

jobs:
  build-aina-v1063:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout AINA repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU PyTorch and fitting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fetch Google GNM v3
        run: |
          git clone --depth 1 https://github.com/google/GNM.git vendor/GNM
          if command -v git-lfs >/dev/null 2>&1; then
            git -C vendor/GNM lfs install --local || true
            git -C vendor/GNM lfs pull || true
          fi
          test -f vendor/GNM/gnm/shape/data/versions/v3_0/gnm_head.npz

      - name: Materialize AINA references
        run: |
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg

      - name: Rebuild clean v10.1 anatomical base
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/GNM
        run: |
          python src/fit_aina_v101.py \
            --front references/AINA_APPROVED_FRONT.jpg \
            --three-quarter references/AINA_APPROVED_3Q.jpg \
            --side references/AINA_APPROVED_SIDE.jpg \
            --outer-steps 16 \
            --out output_v101

      - name: Build v10.6.1 clean reset sculpt
        run: |
          python src/reset_identity_v1061.py \
            --base-full output_v101/AINA_FACE_MASTER_GNM_v10.1.obj \
            --base-skin output_v101/AINA_FACE_MASTER_SKIN_CLAY_v10.1.obj \
            --front references/AINA_APPROVED_FRONT.jpg \
            --cameras output_v101/AINA_CAMERAS_v10.1.json \
            --out output_v1061

      - name: Build v10.6.3 Face Feature Lock
        run: |
          python src/face_feature_lock_v1063.py \
            --base-full output_v1061/AINA_FACE_MASTER_GNM_v10.6.1_FULL_TOPOLOGY.obj \
            --base-skin output_v1061/AINA_FACE_MASTER_SKIN_CLAY_v10.6.1.obj \
            --front references/AINA_APPROVED_FRONT.jpg \
            --cameras output_v101/AINA_CAMERAS_v10.1.json \
            --out output_v1063

      - name: Summarize v10.6.3
        if: always()
        run: |
          echo '## AINA Face Master v10.6.3 Face Feature Lock' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output_v1063/AINA_v10.6.3_REPORT.json ]; then
            echo 'Feature-only sculpt on v10.6.1. No v10.6.2 eye-orbit enlargement inherited.' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output_v1063/AINA_v10.6.3_REPORT.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'v10.6.3 report missing; inspect logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload AINA v10.6.3 model files and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aina-face-master-v10.6.3-face-feature-lock
          path: output_v1063/**
          if-no-files-found: warn
          retention-days: 30
