name: Build AINA Face Master

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - RUN_BUILD_PR
      - src/**
      - requirements.txt
      - references/**
      - .github/workflows/build_aina.yml

permissions:
  contents: read

jobs:
  build-aina-v106:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout AINA repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU PyTorch and fitting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fetch Google GNM v3
        run: |
          git clone --depth 1 https://github.com/google/GNM.git vendor/GNM
          if command -v git-lfs >/dev/null 2>&1; then
            git -C vendor/GNM lfs install --local || true
            git -C vendor/GNM lfs pull || true
          fi
          test -f vendor/GNM/gnm/shape/data/versions/v3_0/gnm_head.npz

      - name: Materialize AINA references
        run: |
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg

      - name: Rebuild clean v10.1 anatomical identity base
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/GNM
        run: |
          python src/fit_aina_v101.py \
            --front references/AINA_APPROVED_FRONT.jpg \
            --three-quarter references/AINA_APPROVED_3Q.jpg \
            --side references/AINA_APPROVED_SIDE.jpg \
            --outer-steps 16 \
            --out output_v101

      - name: Rebuild v10.3 stable semantic base
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/GNM
        run: |
          python src/semantic_sculpt_v103_fix.py \
            --front references/AINA_APPROVED_FRONT.jpg \
            --three-quarter references/AINA_APPROVED_3Q.jpg \
            --side references/AINA_APPROVED_SIDE.jpg \
            --identity output_v101/AINA_identity_coefficients_v10.1.npy \
            --cameras output_v101/AINA_CAMERAS_v10.1.json \
            --out output_v103

      - name: Rebuild v10.4 symmetric eyelid and V-jaw base
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/GNM
        run: |
          python src/identity_lock_v104_fix.py \
            --base-full output_v103/AINA_FACE_MASTER_GNM_v10.3_FULL_TOPOLOGY.obj \
            --front references/AINA_APPROVED_FRONT.jpg \
            --cameras output_v101/AINA_CAMERAS_v10.1.json \
            --out output_v104

      - name: Rebuild v10.5 topology-native eye basis base
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/GNM
        run: |
          python src/eye_basis_lock_v105.py \
            --base-full output_v104/AINA_FACE_MASTER_GNM_v10.4_FULL_TOPOLOGY.obj \
            --front references/AINA_APPROVED_FRONT.jpg \
            --identity output_v101/AINA_identity_coefficients_v10.1.npy \
            --cameras output_v101/AINA_CAMERAS_v10.1.json \
            --out output_v105

      - name: Build v10.6 art-directed identity rebuild
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/GNM
        run: |
          python src/art_directed_rebuild_v106.py \
            --base-full output_v105/AINA_FACE_MASTER_GNM_v10.5_FULL_TOPOLOGY.obj \
            --front references/AINA_APPROVED_FRONT.jpg \
            --identity output_v101/AINA_identity_coefficients_v10.1.npy \
            --cameras output_v101/AINA_CAMERAS_v10.1.json \
            --out output_v106

      - name: Summarize v10.6
        if: always()
        run: |
          echo '## AINA Face Master v10.6' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output_v106/AINA_v10.6_REPORT.json ]; then
            cat output_v106/AINA_v10.6_REPORT.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'v10.6 report missing; inspect logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload AINA v10.6 actual mesh and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aina-face-master-v10.6-art-directed
          path: output_v106/**
          if-no-files-found: warn
          retention-days: 30
