name: Build AINA Face Master

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - RUN_BUILD_PR
      - src/**
      - requirements.txt
      - references/**
      - .github/workflows/build_aina.yml

permissions:
  contents: read

jobs:
  build-aina-v102:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout AINA repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU PyTorch and fitting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fetch Google GNM v3
        run: |
          git clone --depth 1 https://github.com/google/GNM.git vendor/GNM
          if command -v git-lfs >/dev/null 2>&1; then
            git -C vendor/GNM lfs install --local || true
            git -C vendor/GNM lfs pull || true
          fi
          test -f vendor/GNM/gnm/shape/data/versions/v3_0/gnm_head.npz
          ls -lh vendor/GNM/gnm/shape/data/versions/v3_0/gnm_head.npz

      - name: Materialize and verify AINA references
        run: |
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
          base64 -d references/AINA_APPROVED_SIDE.jpg.b64 > references/AINA_APPROVED_SIDE.jpg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for p in sorted(Path('references').glob('AINA_APPROVED_*.jpg')):
              with Image.open(p) as im:
                  im.load(); print(p,im.size,im.mode)
          PY

      - name: Rebuild v10.1 anatomical identity base
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/GNM
        run: |
          python src/fit_aina_v101.py \
            --front references/AINA_APPROVED_FRONT.jpg \
            --three-quarter references/AINA_APPROVED_3Q.jpg \
            --side references/AINA_APPROVED_SIDE.jpg \
            --outer-steps 16 \
            --out output_v101

      - name: Sculpt v10.2 unrestricted identity corrective
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/GNM
        run: |
          python src/corrective_sculpt_v102.py \
            --front references/AINA_APPROVED_FRONT.jpg \
            --three-quarter references/AINA_APPROVED_3Q.jpg \
            --side references/AINA_APPROVED_SIDE.jpg \
            --identity output_v101/AINA_identity_coefficients_v10.1.npy \
            --cameras output_v101/AINA_CAMERAS_v10.1.json \
            --out output_v102

      - name: Summarize v10.2
        if: always()
        run: |
          echo '## AINA Face Master v10.2' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output_v102/AINA_v10.2_REPORT.json ]; then
            echo 'Actual GNM-topology multi-view corrective sculpt completed.' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat output_v102/AINA_v10.2_REPORT.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'v10.2 report missing; inspect logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload AINA v10.2 actual mesh
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aina-face-master-v10.2-corrective
          path: output_v102/**
          if-no-files-found: warn
          retention-days: 30
