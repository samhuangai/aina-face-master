name: Build AINA v12 FaceVerse Base

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - src/reconstruct_aina_faceverse_v120.py
      - .github/workflows/build_faceverse_v120.yml
      - references/AINA_APPROVED_FRONT_V2.jpg.b64
      - references/AINA_APPROVED_3Q.jpg.b64
      - references/AINA_TARGET_3DDFA_SPARSE_68.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy opencv-python-headless onnxruntime trimesh matplotlib pillow requests tqdm
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Materialize AINA references
        run: |
          base64 -d references/AINA_APPROVED_FRONT_V2.jpg.b64 > references/AINA_APPROVED_FRONT.jpg
          base64 -d references/AINA_APPROVED_3Q.jpg.b64 > references/AINA_APPROVED_3Q.jpg
      - name: Fetch FaceVerse ONNX and public release models
        run: |
          git clone --depth 1 https://github.com/Mrkomiljon/faceverse-onnx.git vendor/faceverse-onnx
          cd vendor/faceverse-onnx
          python download_models.py --models faceverse_v4_2.npy faceverse_resnet50_float32.onnx
          test -s data/faceverse_v4_2.npy
          test -s data/faceverse_resnet50_float32.onnx
      - name: Reconstruct neutral AINA FaceVerse identity
        run: python src/reconstruct_aina_faceverse_v120.py
      - name: Summarize
        if: always()
        run: |
          echo '## AINA FaceVerse Base v12.0' >> "$GITHUB_STEP_SUMMARY"
          if [ -f output_faceverse_v120/AINA_FACEVERSE_v12.0_REPORT.json ]; then
            cat output_faceverse_v120/AINA_FACEVERSE_v12.0_REPORT.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'FaceVerse report missing; inspect logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload model and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aina-faceverse-v12.0-base
          path: output_faceverse_v120/**
          if-no-files-found: warn
          retention-days: 30
