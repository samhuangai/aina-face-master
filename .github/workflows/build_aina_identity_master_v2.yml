name: Build AINA Identity Master v2 3D Source

on:
  push:
    branches:
      - aina-identity-master-v2-source
    paths:
      - src/blender/build_aina_identity_master_v2.py
      - .github/workflows/build_aina_identity_master_v2.yml
      - RUN_AINA_IDENTITY_MASTER_V2
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-identity-master-v2-source
  cancel-in-progress: true

jobs:
  build_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4

      - name: Download stable FaceVerse carrier topology
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import os
          import zipfile
          from pathlib import Path
          import requests

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          artifact_id = 9551608513
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          response = requests.get(
              f'https://api.github.com/repos/{repository}/actions/artifacts/{artifact_id}/zip',
              headers=headers,
              timeout=300,
              allow_redirects=True,
          )
          response.raise_for_status()
          source_artifact = Path('source_artifact')
          source_artifact.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
              archive.extractall(source_artifact)
          matches = list(source_artifact.rglob('AINA_CUSTOM_HEAD_TRANSFER_v1.npz'))
          if not matches:
              raise FileNotFoundError('AINA_CUSTOM_HEAD_TRANSFER_v1.npz')
          source = Path('source')
          source.mkdir(exist_ok=True)
          (source / 'AINA_CUSTOM_HEAD_TRANSFER_v1.npz').write_bytes(matches[0].read_bytes())
          print({'artifact_id': artifact_id, 'source_bytes': matches[0].stat().st_size})
          PY
          test -s source/AINA_CUSTOM_HEAD_TRANSFER_v1.npz

      - name: Install Blender 4.5.12 LTS and software-rendering runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libglx-mesa0 libosmesa6 libx11-6 libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libice6
          sudo ldconfig
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz \
            -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"

      - name: Build editable AINA v2 source and actual Blender previews
        run: |
          set -euo pipefail
          mkdir -p output_aina_identity_master_v2
          xvfb-run -a -s '-screen 0 1600x1200x24' "$BLENDER" \
            --background --factory-startup --python-exit-code 1 \
            --python src/blender/build_aina_identity_master_v2.py -- \
            --source source/AINA_CUSTOM_HEAD_TRANSFER_v1.npz \
            --out output_aina_identity_master_v2 \
            2>&1 | tee output_aina_identity_master_v2/BUILD.log

      - name: Verify editable source deliverables
        run: |
          set -euo pipefail
          test -s output_aina_identity_master_v2/AINA_IDENTITY_MASTER_v2.blend
          test -s output_aina_identity_master_v2/AINA_IDENTITY_MASTER_v2.glb
          test -s output_aina_identity_master_v2/AINA_IDENTITY_MASTER_v2.obj
          test -s output_aina_identity_master_v2/AINA_IDENTITY_MASTER_v2.fbx
          test -s output_aina_identity_master_v2/AINA_IDENTITY_MASTER_v2_MANIFEST.json
          test -s output_aina_identity_master_v2/Preview/AINA_FRONT.png
          test -s output_aina_identity_master_v2/Preview/AINA_THREE_QUARTER.png
          test -s output_aina_identity_master_v2/Preview/AINA_PROFILE.png
          test -s output_aina_identity_master_v2/Preview/AINA_BACK.png
          cp src/blender/build_aina_identity_master_v2.py \
             output_aina_identity_master_v2/Source/build_aina_identity_master_v2_bootstrap.py
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output_aina_identity_master_v2/AINA_IDENTITY_MASTER_v2_MANIFEST.json').read_text())
          assert report['real_3d_source'] is True
          assert report['procedural_build'] is True
          assert report['separate_editable_objects'] is True
          assert report['source_file'] == 'AINA_IDENTITY_MASTER_v2.blend'
          assert report['skin_vertices'] > 5000
          assert report['identity_lock'] is False
          assert report['full_vrm_rigged'] is False
          print(json.dumps(report, indent=2))
          PY
          find output_aina_identity_master_v2 -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload AINA v2 3D source package
        uses: actions/upload-artifact@v4
        with:
          name: AINA-IDENTITY-MASTER-V2-3D-SOURCE
          path: output_aina_identity_master_v2/**
          if-no-files-found: error
          retention-days: 30
