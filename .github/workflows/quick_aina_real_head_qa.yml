name: Quick AINA Real Head QA

on:
  push:
    branches: [production/aina-visual-lock]
    paths:
      - src/blender/aina_real_head_quick_qa.py
      - .github/workflows/quick_aina_real_head_qa.yml
  workflow_dispatch:

concurrency:
  group: aina-real-head-quick-qa
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  headqa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Download locked actual v15.5 face
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9275974352/zip" -o diag.zip
          unzip -q diag.zip -d diag
          test -s diag/output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj
      - name: Install Blender render runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libosmesa6 libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libice6
          curl -fL --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz -o blender.tar.xz
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"
      - name: Render actual naked head front and 20-degree QA
        run: |
          set +e
          mkdir -p quick_head_qa qa
          "$BLENDER" --background --factory-startup --python-exit-code 1 \
            --python src/blender/aina_real_head_quick_qa.py -- \
            --face diag/output_locked/AINA_FACEVERSE_FULL_v15.5_IDENTITY_LOCKED.obj \
            --out quick_head_qa 2>&1 | tee qa/AINA_QUICK_HEAD.log
          code=${PIPESTATUS[0]}
          echo "$code" > qa/AINA_QUICK_HEAD_EXIT.txt
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AINA-REAL-HEAD-QUICK-QA
          path: |
            quick_head_qa/**
            qa/AINA_QUICK_HEAD.log
            qa/AINA_QUICK_HEAD_EXIT.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Publish quick head QA status
        if: always()
        env:
          VERIFY_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          e=Path('qa/AINA_QUICK_HEAD_EXIT.txt'); code=int(e.read_text().strip()) if e.exists() else -1
          out=Path('quick_head_qa'); files=[x.name for x in out.glob('*.png')] if out.exists() else []
          log=Path('qa/AINA_QUICK_HEAD.log')
          d={'source_commit':os.environ.get('VERIFY_COMMIT',''),'run_id':os.environ.get('GITHUB_RUN_ID',''),'pass':code==0 and 'AINA_REAL_HEAD_FRONT.png' in files and 'AINA_REAL_HEAD_Q3_20.png' in files,'blender_exit':code,'preview_files':files,'blend_bytes':(out/'AINA_REAL_HEAD_QA.blend').stat().st_size if (out/'AINA_REAL_HEAD_QA.blend').exists() else 0,'log_tail':'\n'.join(log.read_text(errors='replace').splitlines()[-60:]) if log.exists() else ''}
          Path('qa/AINA_QUICK_HEAD_STATUS.json').write_text(json.dumps(d,indent=2),encoding='utf-8');print(json.dumps(d,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/AINA_QUICK_HEAD_STATUS.json
          if ! git diff --cached --quiet; then git commit -m "Record AINA quick real-head QA status"; git push origin HEAD:${GITHUB_REF_NAME}; fi
