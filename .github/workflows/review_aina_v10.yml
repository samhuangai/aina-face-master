name: Review AINA V10 Visual Reconstruction

on:
  push:
    branches: [aina-identity-master-v1-source]
    paths:
      - tools/build_aina_v10.py
      - src/blender/finalize_aina_v10.py
      - .github/workflows/review_aina_v10.yml
      - RUN_AINA_V10_REVIEW
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: review-aina-v10
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
    steps:
      - name: Checkout AINA V10 tools
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build and packaging tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pillow
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip

      - name: Retrieve validated V9 model sources
        run: |
          set -euo pipefail
          rm -rf v9_payload output
          mkdir -p v9_payload output/QA
          gh run download 33747168095 \
            --repo "$GITHUB_REPOSITORY" \
            --name AINA-V9-REVIEW-DIAGNOSTICS \
            --dir v9_payload
          V9_VRM="$(find v9_payload -type f -name 'AINA_VRM_CANDIDATE_V9.vrm' -print -quit)"
          V9_GLB="$(find v9_payload -type f -name 'AINA_BLENDER_SOURCE_V9.glb' -print -quit)"
          test -n "$V9_VRM" && test -s "$V9_VRM"
          test -n "$V9_GLB" && test -s "$V9_GLB"
          cp "$V9_VRM" input_v9.vrm
          cp "$V9_GLB" input_v9_blender.glb

      - name: Build formal and Blender-safe V10 models
        run: |
          set -euo pipefail
          python tools/build_aina_v10.py \
            input_v9.vrm \
            input_v9_blender.glb \
            output \
            2>&1 | tee output/QA/AINA_V10_BUILD.log
          test -s output/AINA_VRM_CANDIDATE_V10.vrm
          test -s output/AINA_BLENDER_SOURCE_V10.glb
          test -s output/AINA_V10_BUILD_REPORT.json

      - name: Install Blender 4.5.12 LTS
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri \
            libglx-mesa0 libosmesa6 libx11-6 libxi6 libxrender1 libxfixes3 \
            libxkbcommon0 libsm6 libice6
          sudo ldconfig
          curl -fL --retry 3 \
            https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz \
            -o blender.tar.xz
          mkdir blender
          tar -xf blender.tar.xz -C blender --strip-components=1
          echo "BLENDER=$PWD/blender/blender" >> "$GITHUB_ENV"

      - name: Build editable V10 source and actual three-view renders
        run: |
          set +e
          xvfb-run -a -s '-screen 0 1400x1000x24' "$BLENDER" \
            --background --factory-startup --python-exit-code 1 \
            --python src/blender/finalize_aina_v10.py -- \
            --input output/AINA_BLENDER_SOURCE_V10.glb \
            --out output \
            2>&1 | tee output/QA/AINA_V10_BLENDER_BUILD.log
          code=${PIPESTATUS[0]}
          echo "$code" > output/QA/AINA_V10_FINALIZER_EXIT.txt
          exit "$code"

      - name: Upload V10 diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AINA-V10-REVIEW-DIAGNOSTICS
          path: output/**
          if-no-files-found: warn
          retention-days: 30

      - name: Verify VRM, rig, Morphs and renders
        run: |
          set -euo pipefail
          test -s output/AINA_MASTER_V10.blend
          test -s output/AINA_EXPORT_V10.glb
          test -s output/AINA_EXPORT_V10.fbx
          test -s output/Preview/AINA_V10_FRONT.png
          test -s output/Preview/AINA_V10_3Q.png
          test -s output/Preview/AINA_V10_PROFILE.png
          test -s output/QA/AINA_V10_BLENDER_QA.json
          python - <<'PY'
          import json,struct
          from pathlib import Path
          data=Path('output/AINA_VRM_CANDIDATE_V10.vrm').read_bytes()
          magic,version,total=struct.unpack_from('<4sII',data,0)
          assert magic==b'glTF' and version==2 and total==len(data)
          offset=12; document=None
          while offset<total:
              length,kind=struct.unpack_from('<II',data,offset); offset+=8
              chunk=data[offset:offset+length]; offset+=length
              if kind==0x4E4F534A:
                  document=json.loads(chunk.decode().rstrip(' \0'))
          vrm=document['extensions']['VRMC_vrm']
          assert vrm['specVersion']=='1.0'
          assert len(vrm['humanoid']['humanBones'])>=54
          assert len(vrm['expressions']['preset'])>=14
          assert len(document['meshes'][0]['primitives'][0].get('targets',[]))==57
          hair=next(m for m in document['materials'] if 'HairBack' in m.get('name',''))
          assert hair.get('emissiveFactor')==[0.0,0.0,0.0]
          assert 'emissiveTexture' not in hair
          print({'vrm_bytes':len(data),'bones':len(vrm['humanoid']['humanBones']),'expressions':len(vrm['expressions']['preset']),'morphs':57})
          PY
          xvfb-run -a "$BLENDER" output/AINA_MASTER_V10.blend \
            --background --python-exit-code 1 \
            --python-expr "import bpy; assert any(o.type=='ARMATURE' for o in bpy.data.objects); assert max((len(o.data.shape_keys.key_blocks)-1 for o in bpy.data.objects if o.type=='MESH' and o.data.shape_keys),default=0)>=57; print('AINA_V10_BLEND_REOPEN_PASS')" \
            | tee output/QA/AINA_V10_BLEND_REOPEN.log

      - name: Compose V10 three-view review sheet
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          root=Path('output'); preview=root/'Preview'
          names=('AINA_V10_FRONT.png','AINA_V10_3Q.png','AINA_V10_PROFILE.png')
          sheet=Image.new('RGB',(1260,520),(30,36,49)); draw=ImageDraw.Draw(sheet)
          for i,name in enumerate(names):
              image=ImageOps.fit(Image.open(preview/name).convert('RGB'),(420,520),Image.Resampling.LANCZOS)
              sheet.paste(image,(i*420,0))
          draw.text((18,16),'AINA V10 ACTUAL BLENDER THREE-VIEW',fill='white')
          sheet.save(preview/'AINA_V10_3VIEW.png',quality=95)
          PY

      - name: Package V10 review source
        run: |
          set -euo pipefail
          cat > output/README_中文.md <<'EOF'
          # AINA V10 人物重塑审片包

          V10 关闭除胸口 Core 外的全部材质自发光，重新分配上庭、中庭和下庭比例，缩小并内收眼睛，隐藏旧黑色眼线层，收窄下颌，并在 Blender 源工程中加入可编辑的睫毛、眉形、唇线、银白刘海、侧发和盘发。

          主要文件：
          - `AINA_VRM_CANDIDATE_V10.vrm`：正式 VRM 1.0 候选。
          - `AINA_MASTER_V10.blend`：包含可编辑曲线发型和面部细节的 Blender 源工程。
          - `AINA_EXPORT_V10.glb` / `.fbx`：研发交换文件。
          - `Preview/AINA_V10_3VIEW.png`：真实 Blender 三视图。
          - `QA/`：骨骼、Morph、材质和重新打开验证。

          结构保留 54 个 Humanoid 映射、57 个面部 Morph、14 个 VRM 标准表达预设。人物最终锁定只依据真实三视图审核。
          EOF
          find output -type f ! -name SHA256SUMS.txt ! -name AINA_V10_REVIEW_PACKAGE.zip -print0 \
            | sort -z | xargs -0 sha256sum > output/SHA256SUMS.txt
          (cd output && zip -9 -r ../AINA_V10_REVIEW_PACKAGE.zip . >/dev/null)
          mv AINA_V10_REVIEW_PACKAGE.zip output/
          sha256sum output/AINA_V10_REVIEW_PACKAGE.zip >> output/SHA256SUMS.txt
          find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload completed V10 review package
        uses: actions/upload-artifact@v4
        with:
          name: AINA-V10-REVIEW-COMPLETE
          path: output/**
          if-no-files-found: error
          retention-days: 30
